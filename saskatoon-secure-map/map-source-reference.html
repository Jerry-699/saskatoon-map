<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Saskatoon Block Finder</title>

  <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@5.6.2/dist/maplibre-gl.css">

  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: Arial, sans-serif;
    }

    #app, #map {
      position: absolute;
      inset: 0;
    }

    /* Make map transition smoothly between day/night */
    .maplibregl-canvas {
      transition: filter .22s ease;
      will-change: transform, filter;
    }

    /* Night mode keeps the SAME detailed OSM tiles, but inverts them.
       This makes dark street labels/house numbers become light and readable. */
    body.dark .maplibregl-canvas {
      filter:
        invert(.82)
        hue-rotate(180deg)
        brightness(.82)
        contrast(.96)
        saturate(.72);
    }

    /* Built-in zoom buttons always stay readable */
    .maplibregl-ctrl-group {
      background: #fff !important;
      border-radius: 10px !important;
      overflow: hidden;
      box-shadow: 0 2px 8px rgba(0,0,0,.35) !important;
    }

    .maplibregl-ctrl-group button {
      background: #fff !important;
    }

    .maplibregl-ctrl-group button:hover {
      background: #eee !important;
    }

    .maplibregl-ctrl-icon {
      filter: none !important;
      opacity: 1 !important;
    }

    /* Google-Maps-style locate button */
    #locateButton {
      position: absolute;
      right: 12px;
      bottom: 62px;
      z-index: 55;
      width: 48px;
      height: 48px;
      border: 0;
      border-radius: 50%;
      background: rgba(255,255,255,.97);
      color: #1769aa;
      font-size: 23px;
      font-weight: 700;
      box-shadow: 0 2px 9px rgba(0,0,0,.35);
      cursor: pointer;
    }

    #locateButton.active {
      background: #1769aa;
      color: #fff;
    }

    body.dark #locateButton {
      background: #f4f4f4;
      color: #1769aa;
    }

    body.dark #locateButton.active {
      background: #1769aa;
      color: #fff;
    }

    /* Three-dot menu */
    #menuButton {
      position: absolute;
      top: 12px;
      left: 12px;
      z-index: 50;
      width: 48px;
      height: 48px;
      border: 0;
      border-radius: 50%;
      background: rgba(255,255,255,.96);
      color: #111;
      font-size: 27px;
      font-weight: 700;
      box-shadow: 0 2px 9px rgba(0,0,0,.35);
      cursor: pointer;
    }

    body.dark #menuButton {
      background: #f4f4f4;
      color: #111;
    }

    /* Main controls */
    #toolbar {
      position: absolute;
      top: 68px;
      left: 10px;
      z-index: 45;
      width: min(365px, calc(100vw - 20px));
      max-height: calc(100vh - 90px);
      overflow-y: auto;
      box-sizing: border-box;
      padding: 10px;
      border-radius: 14px;
      background: rgba(255,255,255,.97);
      box-shadow: 0 4px 16px rgba(0,0,0,.3);
      transition: opacity .2s ease, transform .2s ease;
    }

    #toolbar.hidden {
      opacity: 0;
      pointer-events: none;
      transform: translateX(-110%);
    }

    #toolbar h2 {
      margin: 2px 0 9px;
      font-size: 19px;
    }

    .controls {
      display: flex;
      flex-wrap: wrap;
      gap: 5px;
      margin-bottom: 7px;
    }

    .route-row {
      display: block;
    }

    #savedRoutes {
      width: 100%;
      min-height: 48px;
      font-weight: 700;
      font-size: 16px;
      background: rgba(255,255,255,.96);
    }

    body.dark #savedRoutes {
      background: #2f2f2f;
      color: #fff;
      border-color: #777;
    }

    #routeDriveControls {
      margin-top: 4px;
    }

    #routeDriveBtn,
    #pausePlayBtn {
      min-width: 110px;
      font-weight: 700;
    }

    button, select, input {
      box-sizing: border-box;
      min-height: 42px;
      padding: 8px 10px;
      border: 1px solid #aaa;
      border-radius: 8px;
      background: #fff;
      font-size: 15px;
    }

    button {
      cursor: pointer;
    }

    button.active {
      background: #1769aa;
      color: #fff;
    }

    input {
      width: 100%;
    }

    select {
      max-width: 100%;
    }

    #status {
      margin-top: 5px;
      padding: 9px;
      border-radius: 8px;
      background: #fff3c4;
      font-size: 13px;
      font-weight: 700;
      line-height: 1.45;
    }

    body.dark #toolbar {
      background: rgba(24,24,24,.96);
      color: #fff;
    }

    body.dark button,
    body.dark select,
    body.dark input {
      background: #333;
      color: #fff;
      border-color: #666;
    }

    body.dark #status {
      background: #292929;
      color: #fff;
    }

    /* Custom 4-direction compass */
    #compassRose {
      position: absolute;
      top: 92px;
      right: 10px;
      z-index: 60;
      width: 82px;
      height: 82px;
      border: 0;
      border-radius: 50%;
      padding: 0;
      background: rgba(255,255,255,.96);
      box-shadow: 0 2px 9px rgba(0,0,0,.35);
      cursor: pointer;
      overflow: hidden;
    }

    #compassDial {
      position: absolute;
      inset: 0;
      transition: transform .12s linear;
    }

    .dir {
      position: absolute;
      font-weight: 800;
      font-size: 16px;
      line-height: 1;
      color: #111;
      user-select: none;
    }

    .dir.n {
      top: 7px;
      left: 50%;
      transform: translateX(-50%);
      color: #d71920;
    }

    .dir.s {
      bottom: 7px;
      left: 50%;
      transform: translateX(-50%);
    }

    .dir.e {
      right: 8px;
      top: 50%;
      transform: translateY(-50%);
    }

    .dir.w {
      left: 8px;
      top: 50%;
      transform: translateY(-50%);
    }

    .compass-center {
      position: absolute;
      left: 50%;
      top: 50%;
      width: 9px;
      height: 9px;
      transform: translate(-50%, -50%);
      border-radius: 50%;
      background: #111;
    }

    .compass-arrow {
      position: absolute;
      top: 21px;
      left: 50%;
      width: 0;
      height: 0;
      transform: translateX(-50%);
      border-left: 5px solid transparent;
      border-right: 5px solid transparent;
      border-bottom: 13px solid #d71920;
    }

    body.dark #compassRose {
      background: rgba(245,245,245,.97);
    }

    /* GPS / driving arrow */
    .drive-arrow {
      width: 40px;
      will-change: transform;
      height: 40px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .drive-arrow-inner {
      width: 0;
      height: 0;
      border-left: 14px solid transparent;
      border-right: 14px solid transparent;
      border-bottom: 35px solid #1976d2;
      filter: drop-shadow(0 2px 3px rgba(0,0,0,.75));
    }

    /* Clicked address popup */
    .address-marker {
      min-width: 125px;
      max-width: 205px;
      padding: 7px 9px;
      border: 2px solid #111;
      border-radius: 9px;
      background: rgba(255,255,255,.98);
      color: #111;
      text-align: center;
      font-size: 13px;
      font-weight: 700;
      box-shadow: 0 2px 7px rgba(0,0,0,.4);
      cursor: pointer;
    }

    /* Route start / finish markers */
    .route-start-marker {
      width: 17px;
      height: 17px;
      border-radius: 50%;
      background: #18bf63;
      border: 3px solid #fff;
      box-shadow: 0 1px 5px rgba(0,0,0,.55);
    }

    .route-finish-marker {
      width: 18px;
      height: 18px;
      border: 2px solid #fff;
      box-shadow: 0 1px 5px rgba(0,0,0,.6);
      background:
        conic-gradient(
          #111 0 25%,
          #fff 0 50%,
          #111 0 75%,
          #fff 0
        ) 0 0 / 8px 8px;
    }

    /* Floating Route Drive pause/play control */
    #routePauseOverlay {
      position: absolute;
      left: 50%;
      bottom: 92px;
      transform: translateX(-50%);
      z-index: 70;
      display: none;
      align-items: center;
      justify-content: center;
      pointer-events: none;
      opacity: 0;
      transition: opacity .22s ease;
    }

    #routePauseOverlay.show {
      display: flex;
      opacity: 1;
    }

    #routePauseOverlay button {
      pointer-events: auto;
      min-width: 118px;
      min-height: 48px;
      border: 0;
      border-radius: 24px;
      background: rgba(20,20,20,.90);
      color: #fff;
      font-size: 16px;
      font-weight: 800;
      box-shadow: 0 3px 12px rgba(0,0,0,.35);
    }

    body.dark #routePauseOverlay button {
      background: rgba(245,245,245,.94);
      color: #111;
    }

    /* Persistent stop control. Mobile browsers can suspend/repaint the page after a call
       or app switch, so the user must always have a way to finish an active recording. */
    #recordingStopBtn {
      position: absolute;
      left: 50%;
      bottom: 148px;
      transform: translateX(-50%);
      z-index: 76;
      display: none;
      min-width: 156px;
      min-height: 50px;
      padding: 10px 18px;
      border: 0;
      border-radius: 25px;
      background: rgba(184, 35, 35, .95);
      color: #fff;
      font-size: 16px;
      font-weight: 800;
      box-shadow: 0 3px 12px rgba(0,0,0,.38);
    }

    #recordingStopBtn.show { display: block; }

    /* Drive information */
    #driveInfo {
      position: absolute;
      left: 50%;
      bottom: 40px;
      transform: translateX(-50%);
      z-index: 40;
      display: none;
      white-space: nowrap;
      padding: 8px 14px;
      border-radius: 18px;
      background: rgba(20,20,20,.90);
      color: #fff;
      font-size: 13px;
      font-weight: 700;
    }

    #credit {
      position: absolute;
      bottom: 7px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 40;
      padding: 4px 10px;
      border-radius: 12px;
      background: rgba(255,255,255,.92);
      color: #222;
      font-size: 11px;
      font-weight: 700;
      white-space: nowrap;
    }

    body.dark #credit {
      background: rgba(20,20,20,.90);
      color: #fff;
    }

    @media (max-width: 650px) {
      #compassRose {
        top: 92px;
        right: 10px;
        width: 72px;
        height: 72px;
      }

      .dir {
        font-size: 14px;
      }

      #toolbar {
        width: min(350px, calc(100vw - 20px));
      }
    }
  
    #authBar {
      margin-top: 8px;
      text-align: center;
      font-size: 12px;
    }
    #authBar a {
      color: #1769aa;
      text-decoration: none;
      font-weight: 700;
    }
    body.dark #authBar a {
      color: #8ec7ff;
    }

    #saveDriveBtn { display:none; width:100%; margin-bottom:7px; background:#e8f4ff; border-color:#6aa9df; }
    body.dark #saveDriveBtn { background:#17344e; color:#fff; border-color:#4f89bb; }
    #discardDriveBtn { display:none; width:100%; margin-bottom:7px; }
    #deletePrivateDriveBtn { display:none; width:100%; margin-bottom:7px; }
    #newRouteBtn { width:100%; margin-bottom:7px; font-weight:700; }
    #followLockBtn {
      display:none;
      position:absolute;
      left:50%;
      bottom:78px;
      transform:translateX(-50%);
      z-index:65;
      min-height:46px;
      padding:9px 14px;
      border:1px solid #777;
      border-radius:24px;
      background:rgba(255,255,255,.96);
      color:#111;
      font-weight:800;
      box-shadow:0 2px 9px rgba(0,0,0,.35);
    }
    #followLockBtn.active { background:#1769aa; color:#fff; border-color:#1769aa; }
    body.dark #followLockBtn { background:rgba(35,35,35,.96); color:#fff; border-color:#777; }
    body.dark #followLockBtn.active { background:#1769aa; border-color:#1769aa; }

</style>
</head>

<body>
<div id="app">
  <div id="map"></div>

  <button id="menuButton" aria-label="Open menu">⋮</button>

  <button id="locateButton" aria-label="Show my location" title="Show my location">◎</button>

  <button id="compassRose" aria-label="Compass. Tap to reset north" title="Tap to reset North">
    <div id="compassDial">
      <span class="dir n">N</span>
      <span class="dir e">E</span>
      <span class="dir s">S</span>
      <span class="dir w">W</span>
      <span class="compass-arrow"></span>
      <span class="compass-center"></span>
    </div>
  </button>

  <div id="toolbar">
    <h2>Saskatoon Block Finder</h2>

    <div class="controls">
      <button id="followBtn" title="Drive follows your location but keeps your chosen zoom">🚗 Drive</button>
      <button id="gpsBtn">📍 GPS</button>
      <button id="darkBtn">🌙 Night</button>
      <button id="hydrantBtn">🔥 Hydrants</button>
    </div>


    <button id="newRouteBtn">➕ Make New Route</button>
    <button id="saveDriveBtn">💾 Save this driven route</button>
    <button id="discardDriveBtn">🗑️ Discard unsaved route</button>
    <button id="deletePrivateDriveBtn">🗑️ Delete my saved drive</button>

    <div class="controls route-row">
      <select id="savedRoutes">
        <option value="">Select route</option>
      </select>
    </div>

    <div class="controls" id="routeDriveControls" style="display:none;">
      <button id="routeDriveBtn">🛣️ Drive Route</button>
    </div>

    <div id="status">Select a route or use Drive for normal driving.</div>
    <div id="authBar"><a href="/logout">🔒 Sign out</a></div>
  </div>

  <div id="driveInfo"></div>
  <button id="followLockBtn" class="active" aria-label="Unlock map following">🔒 Follow ON</button>
  <button id="recordingStopBtn" aria-label="Stop current recording">⏹ Stop Recording</button>

  <div id="routePauseOverlay" aria-hidden="true">
    <button id="pausePlayBtn">⏸ Pause</button>
  </div>

  <div id="credit">Saskatoon Block Finder • Made by Faran</div>
</div>

<script src="https://unpkg.com/maplibre-gl@5.6.2/dist/maplibre-gl.js"></script>

<script>
const OSM_TILES = "https://tile.openstreetmap.org/{z}/{x}/{y}.png";

const HYDRANT_SERVICE =
  "https://services.arcgis.com/p3UBboyC0NH1uCie/ArcGIS/rest/services/Prod_SaskatoonWater/FeatureServer/5/query";

const REPORT_HYDRANT_URL =
  "https://service.saskatoon.ca/site/saskatoon/request/cos_report_firehydrantissue";

const BUILTIN_ROUTES = [];
let BACKEND_ROUTES = [];

/* =========================
   MAP
========================= */

const map = new maplibregl.Map({
  container: "map",
  style: {
    version: 8,
    sources: {
      osm: {
        type: "raster",
        tiles: [OSM_TILES],
        tileSize: 256,
        attribution: "© OpenStreetMap contributors"
      }
    },
    layers: [
      {
        id: "osm",
        type: "raster",
        source: "osm"
      }
    ]
  },
  center: [-106.6700, 52.1332],
  zoom: 12,
  bearing: 0,
  pitch: 0,
  dragRotate: true,
  touchPitch: false
});

/* Keep zoom buttons, use our own 4-direction compass */
map.addControl(
  new maplibregl.NavigationControl({
    showCompass: false,
    showZoom: true
  }),
  "top-right"
);

/* =========================
   ELEMENTS / STATE
========================= */

const toolbar = document.getElementById("toolbar");
const menuButton = document.getElementById("menuButton");
const compassRose = document.getElementById("compassRose");
const compassDial = document.getElementById("compassDial");

let menuOpen = true;
const THEME_STORAGE_KEY = "saskatoonTheme";
const THEME_OVERRIDE_UNTIL_KEY = "saskatoonThemeOverrideUntil";

function automaticDarkForTime(date = new Date()) {
  const hour = date.getHours();
  return hour >= 19 || hour < 7;
}

function nextThemeBoundary(date = new Date()) {
  const next = new Date(date);
  const hour = date.getHours();
  if (hour < 7) {
    next.setHours(7, 0, 0, 0);
  } else if (hour < 19) {
    next.setHours(19, 0, 0, 0);
  } else {
    next.setDate(next.getDate() + 1);
    next.setHours(7, 0, 0, 0);
  }
  return next;
}

function readThemeState() {
  try {
    const saved = localStorage.getItem(THEME_STORAGE_KEY);
    const overrideUntil = Number(localStorage.getItem(THEME_OVERRIDE_UNTIL_KEY) || 0);
    if ((saved === "dark" || saved === "light") && overrideUntil > Date.now()) {
      return saved === "dark";
    }
  } catch {}
  return automaticDarkForTime();
}

let darkMode = readThemeState();
let addressMarker = null;
let gpsMarker = null;

let followMode = false;
let followWatchId = null;
let lastGps = null;
let lastHeading = 0;
let lastDriveMapUpdate = 0;

let hydrantsOn = false;
let blockCache = new Map();
let hydrantReloadTimer = null;
let driveHydrantReloadTime = 0;

let routeStartMarker = null;
let routeFinishMarker = null;

let selectedRoute = null;
let driveTraceSegments = [[]];
let driveTracePaused = false;
let driveModeType = null; // "casual", "route", or "newroute"
let mapFollowLocked = true;
let routePauseHideTimer = null;
let PRIVATE_DRIVES = [];
let lastCompletedDriveSegments = [];

/* Recovery + screen-awake state */
const DRIVE_DRAFT_LOCAL_KEY = "saskatoonActiveDriveDraftV1";
let currentUserId = null;
let draftServerTimer = null;
let draftServerSaveInFlight = null;
let lastDraftServerSaveAt = 0;
let draftState = null; // "recording" or "completed"
let wakeLock = null;
let recordingSuspendedByVisibility = false;
let lastVisibleGpsCallbackAt = 0;
let activeDriveRouteSelectorValue = "";



/* =========================
   KEEP SCREEN AWAKE
========================= */

async function requestScreenWakeLock() {
  if (!("wakeLock" in navigator) || document.visibilityState !== "visible") return;
  try {
    if (wakeLock && !wakeLock.released) return;
    wakeLock = await navigator.wakeLock.request("screen");
    wakeLock.addEventListener("release", () => { wakeLock = null; });
  } catch (error) {
    console.warn("Screen wake lock unavailable:", error);
  }
}

function syncRecordingControls() {
  const stopButton = document.getElementById("recordingStopBtn");
  const followBtn = document.getElementById("followBtn");
  const newRouteBtn = document.getElementById("newRouteBtn");
  const routeDriveBtn = document.getElementById("routeDriveBtn");
  const followLockBtn = document.getElementById("followLockBtn");

  if (followMode) {
    stopButton.classList.add("show");
    stopButton.textContent = driveModeType === "route"
      ? "⏹ Stop Route"
      : driveModeType === "newroute"
        ? "⏹ Stop New Route"
        : "⏹ Stop Drive";
    followLockBtn.style.display = "block";

    followBtn.classList.toggle("active", driveModeType === "casual");
    followBtn.textContent = driveModeType === "casual" ? "⏹ Stop Drive" : "🚗 Drive";
    newRouteBtn.classList.toggle("active", driveModeType === "newroute");
    newRouteBtn.textContent = driveModeType === "newroute" ? "⏹ Stop New Route" : "➕ Make New Route";

    if (driveModeType === "route") {
      routeDriveBtn.classList.add("active");
      routeDriveBtn.textContent = "⏹ Stop Route";
    } else {
      routeDriveBtn.classList.remove("active");
      routeDriveBtn.textContent = "🛣️ Drive Route";
    }
  } else {
    stopButton.classList.remove("show");
  }
}

document.getElementById("recordingStopBtn").addEventListener("click", () => {
  if (!followMode) return;
  stopDrive();
  setMenu(true);
});

document.addEventListener("visibilitychange", () => {
  if (document.visibilityState === "hidden") {
    if (followMode) {
      recordingSuspendedByVisibility = true;
      persistDriveDraft("recording", true);
    }
    return;
  }

  requestScreenWakeLock();
  syncRecordingControls();

  if (followMode && recordingSuspendedByVisibility) {
    recordingSuspendedByVisibility = false;
    lastGps = null;
    lastVisibleGpsCallbackAt = 0;

    if (!driveTracePaused) {
      const currentSegment = driveTraceSegments[driveTraceSegments.length - 1];
      if (currentSegment && currentSegment.length > 0) {
        driveTraceSegments.push([]);
      }
      persistDriveDraft("recording", true);
    }

    status("Recording resumed after leaving the app. A new blue segment was started so no false straight line is drawn. Use the red Stop button when finished.");
  }
});

/* pageshow also fires when a mobile browser restores this page from its back/forward cache.
   Rebuild the recording controls from JavaScript state so a suspended/repainted page never
   loses the Stop button. */
window.addEventListener("pageshow", () => {
  syncRecordingControls();
  if (followMode) requestScreenWakeLock();
});

/* A user gesture gives browsers another chance to grant wake lock. */
document.addEventListener("pointerdown", requestScreenWakeLock, { passive: true });

/* =========================
   UNSAVED DRIVE RECOVERY
========================= */

function cleanDraftSegments(segments) {
  if (!Array.isArray(segments)) return [];
  return segments.slice(0, 500).map(segment => {
    if (!Array.isArray(segment)) return [];
    return segment.slice(0, 30000).map(p => ({ lat: Number(p?.lat), lng: Number(p?.lng) }))
      .filter(p => Number.isFinite(p.lat) && Number.isFinite(p.lng) && p.lat >= -90 && p.lat <= 90 && p.lng >= -180 && p.lng <= 180);
  }).filter(segment => segment.length > 0);
}

function draftPointCount(segments) {
  return cleanDraftSegments(segments).reduce((n, segment) => n + segment.length, 0);
}

function makeDraftPayload(state = draftState || "recording") {
  const selector = document.getElementById("savedRoutes");
  return {
    state,
    mode: driveModeType || "newroute",
    segments: cleanDraftSegments(state === "completed" ? lastCompletedDriveSegments : driveTraceSegments),
    selectedRouteValue: selector?.value || "",
    paused: !!driveTracePaused,
    savedAt: Date.now()
  };
}

function saveDraftLocally(payload) {
  if (!currentUserId) return;
  try {
    localStorage.setItem(DRIVE_DRAFT_LOCAL_KEY, JSON.stringify({ ...payload, userId: currentUserId }));
  } catch (error) {
    console.warn("Could not save local drive recovery:", error);
  }
}

async function saveDraftToServer(payload) {
  /* Serialize saves so an older request can never finish after a newer one and overwrite it. */
  const run = async () => {
    try {
      const response = await fetch("/api/drive-draft", {
        method: "PUT",
        credentials: "same-origin",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(payload),
        keepalive: true
      });
      if (response.ok) lastDraftServerSaveAt = Date.now();
      return response.ok;
    } catch (error) {
      console.warn("Could not save drive recovery to server:", error);
      return false;
    }
  };

  const previous = draftServerSaveInFlight || Promise.resolve();
  draftServerSaveInFlight = previous.catch(() => {}).then(run);
  try {
    return await draftServerSaveInFlight;
  } finally {
    if (draftServerSaveInFlight) draftServerSaveInFlight = null;
  }
}

function persistDriveDraft(state = draftState || "recording", immediateServer = false) {
  const payload = makeDraftPayload(state);
  if (draftPointCount(payload.segments) < 1) return;
  draftState = state;
  saveDraftLocally(payload);

  /*
    Do NOT debounce this by resetting an 8-second timer on every GPS point.
    While driving, GPS updates arrive continuously, so the old debounce could postpone
    the Supabase save forever. Save to Supabase at least every 5 seconds instead.
  */
  const SERVER_SAVE_EVERY_MS = 5000;
  const elapsed = Date.now() - lastDraftServerSaveAt;

  if (immediateServer || elapsed >= SERVER_SAVE_EVERY_MS) {
    clearTimeout(draftServerTimer);
    draftServerTimer = null;
    saveDraftToServer(payload);
    return;
  }

  if (!draftServerTimer) {
    draftServerTimer = setTimeout(() => {
      draftServerTimer = null;
      const latestPayload = makeDraftPayload(draftState || state);
      if (draftPointCount(latestPayload.segments) > 0) saveDraftToServer(latestPayload);
    }, Math.max(250, SERVER_SAVE_EVERY_MS - elapsed));
  }
}

async function clearDriveDraft() {
  draftState = null;
  clearTimeout(draftServerTimer);
  draftServerTimer = null;
  try { localStorage.removeItem(DRIVE_DRAFT_LOCAL_KEY); } catch {}
  try {
    await fetch("/api/drive-draft", { method: "DELETE", credentials: "same-origin", keepalive: true });
  } catch {}
}

async function fetchDriveDraft() {
  let server = null;
  try {
    const response = await fetch("/api/drive-draft", { cache: "no-store", credentials: "same-origin" });
    if (response.ok) {
      const data = await response.json();
      currentUserId = data.userId || null;
      server = data.draft || null;
    }
  } catch (error) {
    console.warn("Could not load server drive recovery:", error);
  }

  let local = null;
  try {
    const raw = JSON.parse(localStorage.getItem(DRIVE_DRAFT_LOCAL_KEY) || "null");
    if (raw && currentUserId && raw.userId === currentUserId) local = raw;
  } catch {}

  if (!local) return server;
  if (!server) return local;
  return Number(local.savedAt || 0) >= Number(server.savedAt || 0) ? local : server;
}

function showRecoveredCompletedDraft(draft) {
  const segments = cleanDraftSegments(draft?.segments);
  if (draftPointCount(segments) < 2) return false;
  lastCompletedDriveSegments = segments;
  driveTraceSegments = segments.map(segment => segment.map(p => ({ ...p })));
  setMultiLine("liveDriveTrace", driveTraceSegments, "#1689ff", .84, 4.8);
  document.getElementById("saveDriveBtn").style.display = "block";
  document.getElementById("discardDriveBtn").style.display = "block";
  draftState = "completed";
  status("Recovered your unsaved route. It is still blue until you save it.");
  return true;
}

function resumeRecoveredRecording(draft) {
  let mode = ["casual", "route", "newroute"].includes(draft?.mode) ? draft.mode : "newroute";
  let restoredRoute = null;
  if (mode === "route" && draft.selectedRouteValue) {
    restoredRoute = getSelectedRouteByValue(draft.selectedRouteValue);
    if (!restoredRoute) mode = "newroute";
  }

  if (restoredRoute) {
    document.getElementById("savedRoutes").value = draft.selectedRouteValue;
    showSelectedRoute(restoredRoute);
  } else if (mode === "newroute") {
    removeLine("oldRoute");
    clearRouteEndpointMarkers();
    selectedRoute = null;
    document.getElementById("savedRoutes").value = "";
    document.getElementById("routeDriveControls").style.display = "none";
  }

  if (!prepareDrive(mode, true)) return false;
  driveTraceSegments = cleanDraftSegments(draft.segments);
  if (!driveTraceSegments.length) driveTraceSegments = [[]];
  driveTracePaused = !!draft.paused;

  /* Start a fresh segment after reopening so a long closed-window gap is never joined by a fake straight line. */
  if (!driveTracePaused) driveTraceSegments.push([]);
  if (mode === "route" || mode === "newroute") {
    setMultiLine("liveDriveTrace", driveTraceSegments, "#1689ff", .84, 4.8);
  }
  if (mode === "route") {
    document.getElementById("pausePlayBtn").textContent = driveTracePaused ? "▶ Play" : "⏸ Pause";
  }
  draftState = "recording";
  status(driveTracePaused
    ? "Recovered your unfinished route. Recording is paused; tap Play to continue."
    : "Recovered your unfinished route and continued recording from where you left off.");
  startDriveWatcher();
  return true;
}

async function restoreDriveDraftIfAny() {
  const draft = await fetchDriveDraft();
  if (!draft || draftPointCount(draft.segments) < 1) return;
  if (draft.state === "completed") {
    showRecoveredCompletedDraft(draft);
  } else {
    resumeRecoveredRecording(draft);
  }
}

/* Save the latest route to Supabase BEFORE signing out. This makes recovery reliable even
   if the user stays logged out for hours/days or returns on another device. */
const signOutLink = document.querySelector('#authBar a[href="/logout"]');
if (signOutLink) {
  signOutLink.addEventListener("click", async event => {
    if (!(followMode || lastCompletedDriveSegments.length)) return;
    event.preventDefault();

    const state = followMode ? "recording" : "completed";
    const payload = makeDraftPayload(state);
    if (draftPointCount(payload.segments) > 0) {
      saveDraftLocally(payload);
      await saveDraftToServer(payload);
    }
    window.location.href = "/logout";
  });
}

function blockRange(number) {
  const n = parseInt(number);
  if (Number.isNaN(n)) return null;

  const start = Math.floor(n / 100) * 100;
  return {
    start,
    end: start + 99,
    text: `${start}-${start + 99}`
  };
}

function distanceMetres(a, b) {
  const R = 6371000;
  const lat1 = a.lat * Math.PI / 180;
  const lat2 = b.lat * Math.PI / 180;
  const dLat = (b.lat - a.lat) * Math.PI / 180;
  const dLng = (b.lng - a.lng) * Math.PI / 180;

  const h =
    Math.sin(dLat / 2) ** 2 +
    Math.cos(lat1) *
    Math.cos(lat2) *
    Math.sin(dLng / 2) ** 2;

  return R * 2 * Math.atan2(Math.sqrt(h), Math.sqrt(1 - h));
}

function routeDistance(points) {
  let total = 0;
  for (let i = 1; i < points.length; i++) {
    total += distanceMetres(points[i - 1], points[i]);
  }
  return total;
}

function calculateBearing(a, b) {
  const lat1 = a.lat * Math.PI / 180;
  const lat2 = b.lat * Math.PI / 180;
  const dLng = (b.lng - a.lng) * Math.PI / 180;

  const y = Math.sin(dLng) * Math.cos(lat2);
  const x =
    Math.cos(lat1) * Math.sin(lat2) -
    Math.sin(lat1) * Math.cos(lat2) * Math.cos(dLng);

  return (Math.atan2(y, x) * 180 / Math.PI + 360) % 360;
}

/* =========================
   BLOCK / ADDRESS FINDER
========================= */

async function reverseGeocode(lat, lng) {
  const key = `${lat.toFixed(5)},${lng.toFixed(5)}`;

  if (blockCache.has(key)) {
    return blockCache.get(key);
  }

  try {
    const url =
      "https://nominatim.openstreetmap.org/reverse" +
      "?format=jsonv2" +
      "&addressdetails=1" +
      "&zoom=18" +
      "&lat=" + lat +
      "&lon=" + lng;

    const response = await fetch(url);
    const data = await response.json();
    const a = data.address || {};

    const result = {
      road:
        a.road ||
        a.street ||
        a.residential ||
        a.pedestrian ||
        a.service ||
        "Street unknown",
      house: a.house_number || null
    };

    blockCache.set(key, result);
    return result;
  } catch {
    return {
      road: "Street unknown",
      house: null
    };
  }
}

async function findNearbyBlock(lat, lng, road) {
  if (!road || road === "Street unknown") return null;

  const controller = new AbortController();
  const timer = setTimeout(() => controller.abort(), 3500);

  try {
    const safeRoad = road.replace(/"/g, '\\"');

    const query = `
[out:json][timeout:3];
(
  node["addr:housenumber"]["addr:street"="${safeRoad}"](around:220,${lat},${lng});
  way["addr:housenumber"]["addr:street"="${safeRoad}"](around:220,${lat},${lng});
);
out center tags 30;
`;

    const url =
      "https://overpass-api.de/api/interpreter?data=" +
      encodeURIComponent(query);

    const response = await fetch(url, {
      signal: controller.signal
    });

    const data = await response.json();
    clearTimeout(timer);

    const numbers = [];

    for (const item of data.elements || []) {
      const num = parseInt(item.tags?.["addr:housenumber"]);
      if (!Number.isNaN(num)) {
        numbers.push(num);
      }
    }

    if (!numbers.length) return null;

    numbers.sort((a, b) => a - b);

    return blockRange(
      numbers[Math.floor(numbers.length / 2)]
    );
  } catch {
    clearTimeout(timer);
    return null;
  }
}

async function showBlock(lat, lng) {
  status("Finding street and block...");

  const info = await reverseGeocode(lat, lng);

  let block =
    info.house
      ? blockRange(info.house)
      : null;

  if (!block) {
    block = await findNearbyBlock(lat, lng, info.road);
  }

  const blockText =
    block
      ? `${block.text} ${info.road}`
      : `Block unknown • ${info.road}`;

  status(
    `Street: ${info.road}<br>` +
    `Block: ${blockText}` +
    (info.house ? `<br>Nearest address: ${info.house}` : "")
  );

  if (addressMarker) {
    addressMarker.remove();
  }

  const box = document.createElement("div");
  box.className = "address-marker";
  box.innerHTML =
    (info.house ? `${info.house}<br>` : "") +
    blockText +
    "<br><small>Tap to close</small>";

  addressMarker =
    new maplibregl.Marker({
      element: box,
      anchor: "bottom"
    })
    .setLngLat([lng, lat])
    .addTo(map);

  box.addEventListener("click", event => {
    event.stopPropagation();

    if (addressMarker) {
      addressMarker.remove();
      addressMarker = null;
    }
  });
}

let lastMapTapTime = 0;
let lastMapTapPoint = null;

function closeAddressMarker() {
  if (addressMarker) {
    addressMarker.remove();
    addressMarker = null;
    status("Location label closed.");
    return true;
  }

  return false;
}

/*
  Single tap:
  - During Route Drive, show Pause/Play briefly.
  - Otherwise do nothing, so accidental touches do not open addresses.
*/
map.on("click", event => {
  if (
    followMode &&
    driveModeType === "route"
  ) {
    showRoutePauseOverlay();
  }

  /*
    Manual double-tap detection for phones.
    MapLibre's dblclick works well with a mouse,
    but mobile double-tap is handled here too.
  */
  const now = Date.now();

  if (
    lastMapTapTime &&
    now - lastMapTapTime <= 350 &&
    lastMapTapPoint
  ) {
    const dx =
      event.point.x -
      lastMapTapPoint.x;

    const dy =
      event.point.y -
      lastMapTapPoint.y;

    const distance =
      Math.sqrt(
        dx * dx +
        dy * dy
      );

    if (distance <= 32) {
      lastMapTapTime = 0;
      lastMapTapPoint = null;

      if (closeAddressMarker()) {
        return;
      }

      showBlock(
        event.lngLat.lat,
        event.lngLat.lng
      );

      return;
    }
  }

  lastMapTapTime = now;
  lastMapTapPoint = {
    x: event.point.x,
    y: event.point.y
  };
});

/*
  Desktop double-click.
  Prevent default double-click zoom so the action
  is used for the address/block lookup instead.
*/
map.doubleClickZoom.disable();

map.on("dblclick", event => {
  if (closeAddressMarker()) {
    return;
  }

  showBlock(
    event.lngLat.lat,

  );
});

function createGpsArrow() {
  const wrapper = document.createElement("div");
  wrapper.className = "drive-arrow";

  const arrow = document.createElement("div");
  arrow.className = "drive-arrow-inner";

  wrapper.appendChild(arrow);
  return wrapper;
}

function updateGpsMarker(lng, lat, heading) {
  if (!gpsMarker) {
    gpsMarker =
      new maplibregl.Marker({
        element: createGpsArrow(),
        rotationAlignment: "viewport",
        pitchAlignment: "viewport"
      })
      .setLngLat([lng, lat])
      .addTo(map);
  }

  gpsMarker
    .setLngLat([lng, lat])
    .setRotation(heading || 0);
}

let gpsMarkerAnimation = null;
let gpsDisplayPosition = null;

function smoothGpsMarkerTo(lng, lat, duration = 850) {
  if (!gpsMarker) {
    updateGpsMarker(lng, lat, 0);
    gpsDisplayPosition = { lng, lat };
    return;
  }

  const start = gpsDisplayPosition || {
    lng: gpsMarker.getLngLat().lng,
    lat: gpsMarker.getLngLat().lat
  };

  const target = { lng, lat };
  const started = performance.now();

  if (gpsMarkerAnimation) {
    cancelAnimationFrame(gpsMarkerAnimation);
  }

  function frame(now) {
    const raw = Math.min(1, (now - started) / duration);
    const t = 1 - Math.pow(1 - raw, 3);

    const currentLng = start.lng + (target.lng - start.lng) * t;
    const currentLat = start.lat + (target.lat - start.lat) * t;

    gpsMarker.setLngLat([currentLng, currentLat]).setRotation(0);
    gpsDisplayPosition = { lng: currentLng, lat: currentLat };

    if (raw < 1 && followMode) {
      gpsMarkerAnimation = requestAnimationFrame(frame);
    } else {
      gpsDisplayPosition = target;
      gpsMarkerAnimation = null;
    }
  }

  gpsMarkerAnimation = requestAnimationFrame(frame);
}

========================= */

document.getElementById("gpsBtn").addEventListener("click", getAccurateGPS);

function getAccurateGPS() {
  if (!navigator.geolocation) {
    status("GPS not supported.");
    return;
  }

  status("Getting accurate GPS...");

  let best = null;
  let readings = 0;

  const watcher =
    navigator.geolocation.watchPosition(
      position => {
        readings++;

        if (
          !best ||
          position.coords.accuracy <
          best.coords.accuracy
        ) {
          best = position;
        }

        status(
          `Improving GPS...<br>` +
          `Accuracy ±${Math.round(position.coords.accuracy)} m`
        );

        if (
          position.coords.accuracy <= 8 ||
          readings >= 8
        ) {
          navigator.geolocation.clearWatch(watcher);

          const lat = best.coords.latitude;
          const lng = best.coords.longitude;

          updateGpsMarker(lng, lat, 0);

          map.flyTo({
            center: [lng, lat],
            zoom: 18,
            duration: 500
          });

          showBlock(lat, lng);
        }
      },
      () => {
        status("Please allow precise location.");
      },
      {
        enableHighAccuracy: true,
        maximumAge: 0,
        timeout: 15000
      }
    );
}

function prepareDrive(mode, resuming = false) {
  if (!navigator.geolocation) {
    status("GPS not supported.");
    return false;
  }

  if (followWatchId != null) {
    navigator.geolocation.clearWatch(followWatchId);
    followWatchId = null;
  }

  followMode = true;
  driveModeType = mode;
  activeDriveRouteSelectorValue = document.getElementById("savedRoutes")?.value || "";
  recordingSuspendedByVisibility = false;
  lastVisibleGpsCallbackAt = 0;
  mapFollowLocked = true;
  setMapFollowLocked(true, false);
  document.getElementById("followLockBtn").style.display = "block";
  lastGps = null;
  lastHeading = map.getBearing() || 0;
  lastDriveMapUpdate = 0;

  driveTracePaused = false;

  clearLiveDriveTrace();
  driveTraceSegments = [[]];
  if (!resuming) {
    lastCompletedDriveSegments = [];
    draftState = "recording";
  }
  document.getElementById("saveDriveBtn").style.display = "none";
  document.getElementById("discardDriveBtn").style.display = "none";

  setMenu(false);
  requestScreenWakeLock();

  document.getElementById("driveInfo").style.display = "block";

  document.getElementById("followBtn").classList.toggle(
    "active",
    mode === "casual"
  );

  document.getElementById("followBtn").textContent =
    mode === "casual"
      ? "⏹ Stop Drive"
      : "🚗 Drive";

  const routeDriveBtn =
    document.getElementById("routeDriveBtn");
  const newRouteBtn = document.getElementById("newRouteBtn");
  newRouteBtn.classList.toggle("active", mode === "newroute");
  newRouteBtn.textContent = mode === "newroute" ? "⏹ Stop New Route" : "➕ Make New Route";

  const pausePlayBtn =
    document.getElementById("pausePlayBtn");

  if (mode === "route") {
    routeDriveBtn.classList.add("active");
    routeDriveBtn.textContent = "⏹ Stop Route";
    pausePlayBtn.textContent = "⏸ Pause";
    showRoutePauseOverlay();
  } else {
    routeDriveBtn.classList.remove("active");
    routeDriveBtn.textContent = "🛣️ Drive Route";
    hideRoutePauseOverlay();
  }

  syncRecordingControls();
  return true;
}

function canStartNewRecording() {
  if (!followMode && draftState === "completed" && draftPointCount(lastCompletedDriveSegments) >= 2) {
    status("You have an unsaved route. Save it or tap Discard unsaved route before starting another recording.");
    setMenu(true);
    return false;
  }
  return true;
}

function startCasualDrive() {
  if (!canStartNewRecording()) return;
  if (!prepareDrive("casual")) {
    return;
  }

  status("Normal Drive started. Your position stays centered on the map.");

  startDriveWatcher();
}

function startNewRouteRecording() {
  if (!canStartNewRecording()) return;
  if (!prepareDrive("newroute")) {
    return;
  }

  removeLine("oldRoute");
  clearRouteEndpointMarkers();
  selectedRoute = null;
  document.getElementById("savedRoutes").value = "";
  document.getElementById("routeDriveControls").style.display = "none";
  document.getElementById("deletePrivateDriveBtn").style.display = "none";
  status("Making a new private route. Blue = the route you are recording. Stop when finished, then save it.");
  startDriveWatcher();
}

function startRouteDrive() {
  if (!canStartNewRecording()) return;
  if (!selectedRoute) {
    alert("Select a route first.");
    return;
  }

  if (!prepareDrive("route")) {
    return;
  }

  status(
    `Driving "${selectedRoute.name}". Red = planned route, blue = where you actually drive.`
  );

  startDriveWatcher();
}

function startDriveWatcher() {
  followWatchId =
    navigator.geolocation.watchPosition(
      position => {
        if (!followMode) return;

        /* Mobile browsers may pause GPS callbacks while a call/app is in front.
           Never record while hidden, and never connect a long callback gap. */
        if (document.visibilityState !== "visible") {
          recordingSuspendedByVisibility = true;
          return;
        }

        const now = Date.now();
        const hadLongGpsGap = lastVisibleGpsCallbackAt > 0 && (now - lastVisibleGpsCallbackAt) > 12000;
        lastVisibleGpsCallbackAt = now;

        if (hadLongGpsGap && !driveTracePaused) {
          const currentSegment = driveTraceSegments[driveTraceSegments.length - 1];
          if (currentSegment && currentSegment.length > 0) {
            driveTraceSegments.push([]);
          }
          lastGps = null;
          persistDriveDraft("recording", true);
        }
        const lat = position.coords.latitude;
        const lng = position.coords.longitude;
        const accuracy = position.coords.accuracy;
        const speed = position.coords.speed;

        const currentPoint = { lat, lng };

        let heading = position.coords.heading;

        if (
          (heading == null || Number.isNaN(heading)) &&
          lastGps
        ) {
          const moved =
            distanceMetres(
              lastGps,
              currentPoint
            );

          if (moved >= 2.5) {
            heading =
              calculateBearing(
                lastGps,
                currentPoint
              );
          }
        }

        if (
          heading != null &&
          !Number.isNaN(heading)
        ) {
          const difference =
            ((heading - lastHeading + 540) % 360) - 180;

          lastHeading =
            (
              lastHeading +
              difference * 0.22 +
              360
            ) % 360;
        }

        /*
          Arrow stays forward while the map rotates.
        */
        updateGpsMarker(
          lng,
          lat,
          0
        );


        /* Record the actual path for both normal Drive and Route Drive.
           Route Drive also draws it live in blue. */
        if (
          (driveModeType === "casual" || driveModeType === "route" || driveModeType === "newroute") &&
          !driveTracePaused &&
          accuracy <= 50
        ) {
          let currentSegment =
            driveTraceSegments[
              driveTraceSegments.length - 1
            ];

          if (!currentSegment) {
            currentSegment = [];
            driveTraceSegments.push(currentSegment);
          }

          const previous =
            currentSegment[
              currentSegment.length - 1
            ];

          if (
            !previous ||
            distanceMetres(
              previous,
              currentPoint
            ) >= 1.5
          ) {
            currentSegment.push(
              currentPoint
            );
            persistDriveDraft("recording");

            if (driveModeType === "route" || driveModeType === "newroute") {
              setMultiLine(
                "liveDriveTrace",
                driveTraceSegments,
                "#1689ff",
                .84,
                4.8
              );
            }
          }
        }

        /*
          Keep the blue arrow in a fixed lower-center position while driving.
          IMPORTANT: we do NOT set zoom here.
          Whatever zoom you choose with + / - stays exactly as you set it.
        */
        if (
          mapFollowLocked &&
          now - lastDriveMapUpdate > 650
        ) {
          lastDriveMapUpdate = now;

          const arrowScreenOffsetY =
            Math.min(
              190,
              Math.max(
                115,
                window.innerHeight * 0.17
              )
            );

          map.easeTo({
            center: [lng, lat],
            bearing: lastHeading,
            pitch: 0,
            offset: [0, arrowScreenOffsetY],
            duration: 700,
            easing: t =>
              1 - Math.pow(1 - t, 3)
          });
        }

        let speedKmh = null;

        if (speed != null) {
          speedKmh =
            Math.max(0, speed * 3.6);
        }

        document.getElementById("driveInfo").innerHTML =
          (speedKmh == null
            ? ""
            : `${speedKmh.toFixed(0)} km/h • `) +
          `GPS ±${Math.round(accuracy)} m`;

        if (
          hydrantsOn &&
          now - driveHydrantReloadTime > 20000
        ) {
          driveHydrantReloadTime = now;
          loadHydrants();
        }

        lastGps = currentPoint;
      },
      error => {
        console.error(
          "Drive GPS error:",
          error
        );

        status(
          "Please allow precise location."
        );

        stopDrive();
      },
      {
        enableHighAccuracy: true,
        maximumAge: 250,
        timeout: 15000
      }
    );
}

function stopDrive() {
  const oldMode =
    driveModeType;

  followMode = false;
  driveModeType = null;
  recordingSuspendedByVisibility = false;
  lastVisibleGpsCallbackAt = 0;
  activeDriveRouteSelectorValue = document.getElementById("savedRoutes")?.value || "";

  if (followWatchId != null) {
    navigator.geolocation.clearWatch(
      followWatchId
    );

    followWatchId = null;
  }

  document.getElementById("followBtn").classList.remove("active");
  document.getElementById("followBtn").textContent = "🚗 Drive";

  const routeDriveBtn =
    document.getElementById("routeDriveBtn");

  routeDriveBtn.classList.remove("active");
  routeDriveBtn.textContent = "🛣️ Drive Route";

  hideRoutePauseOverlay();
  document.getElementById("driveInfo").style.display = "none";
  document.getElementById("followLockBtn").style.display = "none";
  setMapFollowLocked(true, false);
  const newRouteBtn = document.getElementById("newRouteBtn");
  newRouteBtn.classList.remove("active");
  newRouteBtn.textContent = "➕ Make New Route";
  syncRecordingControls();

  driveTracePaused = false;

  const completedPoints = driveTraceSegments.reduce((count, seg) => count + seg.length, 0);
  if (completedPoints >= 2) {
    lastCompletedDriveSegments = driveTraceSegments
      .filter(seg => seg.length >= 2)
      .map(seg => seg.map(p => ({ lat: p.lat, lng: p.lng })));
    document.getElementById("saveDriveBtn").style.display = "block";
    document.getElementById("discardDriveBtn").style.display = "block";
    setMenu(true);
    draftState = "completed";
    persistDriveDraft("completed", true);
  }

  if (oldMode === "route" && selectedRoute) {
    status(
      `Route Drive stopped. "${selectedRoute.name}" is still showing.`
    );
  } else if (oldMode === "newroute") {
    status(completedPoints >= 2
      ? "New route recording stopped. Tap Save this driven route to keep it privately."
      : "New route recording stopped. Not enough GPS points were recorded to save it.");
  } else {
    status(
      "Normal Drive stopped."
    );
  }
}

/*
  Pause / Play only exists for Route Drive.
  Pause stops recording the blue comparison line.
  Your GPS position and map can still follow you.
*/
document
  .getElementById("pausePlayBtn")
  .addEventListener(
    "click",
    () => {
      if (
        !followMode ||
        driveModeType !== "route" ||
        !selectedRoute
      ) {
        return;
      }

      const wasPaused =
        driveTracePaused;

      driveTracePaused =
        !driveTracePaused;

      /*
        When resuming after a pause, begin a brand-new blue segment.
        This prevents an ugly straight line connecting the pause point
        to wherever you restarted.
      */
      if (
        wasPaused &&
        !driveTracePaused
      ) {
        driveTraceSegments.push([]);
      }

      document
        .getElementById("pausePlayBtn")
        .textContent =
          driveTracePaused
            ? "▶ Play"
            : "⏸ Pause";

      status(
        driveTracePaused
          ? "Route tracking paused."
          : `Route tracking resumed for "${selectedRoute.name}".`
      );

      showRoutePauseOverlay();
      persistDriveDraft("recording", true);
    }
  );


/* =========================
   ROUTE LINE HELPERS
========================= */

function setLine(
  id,
  points,
  color,
  opacity = .5,
  width = 7,
  dash = null
) {
  if (points.length < 2) return;

  const data = {
    type: "Feature",
    geometry: {
      type: "LineString",
      coordinates:
        points.map(point => [
          point.lng,
          point.lat
        ])
    }
  };

  if (map.getSource(id)) {
    map.getSource(id).setData(data);
    return;
  }

  map.addSource(id, {
    type: "geojson",
    data
  });

  const paint = {
    "line-color": color,
    "line-width": width,
    "line-opacity": opacity
  };

  if (dash) {
    paint["line-dasharray"] = dash;
  }

  map.addLayer({
    id,
    type: "line",
    source: id,
    layout: {
      "line-join": "round",
      "line-cap": "round"
    },
    paint
  });
}

function removeLine(id) {
  if (map.getLayer(id)) {
    map.removeLayer(id);
  }

  if (map.getSource(id)) {
    map.removeSource(id);
  }
}


function setMultiLine(
  id,
  segments,
  color,
  opacity = .84,
  width = 4.8
) {
  const usableSegments =
    segments
      .filter(segment => segment.length >= 2)
      .map(segment =>
        segment.map(point => [
          point.lng,
          point.lat
        ])
      );

  if (!usableSegments.length) {
    return;
  }

  const data = {
    type: "Feature",
    geometry: {
      type: "MultiLineString",
      coordinates: usableSegments
    }
  };

  if (map.getSource(id)) {
    map.getSource(id).setData(data);
    return;
  }

  map.addSource(id, {
    type: "geojson",
    data
  });

  map.addLayer({
    id,
    type: "line",
    source: id,
    layout: {
      "line-join": "round",
      "line-cap": "round"
    },
    paint: {
      "line-color": color,
      "line-width": width,
      "line-opacity": opacity
    }
  });
}

/* =========================
   ROUTE START / FINISH
========================= */

function clearRouteEndpointMarkers() {
  if (routeStartMarker) {
    routeStartMarker.remove();
    routeStartMarker = null;
  }

  if (routeFinishMarker) {
    routeFinishMarker.remove();
    routeFinishMarker = null;
  }
}

function showRouteEndpointMarkers(route) {
  // Start/end markers intentionally hidden.
  clearRouteEndpointMarkers();
}


/* =========================
   SAVED ROUTES
========================= */

function getRoutes() {
  try {
    return JSON.parse(
      localStorage.getItem("faranRoutes") ||
      "[]"
    );
  } catch {
    return [];
  }
}

function saveRoute(name, points, color) {
  const routes = getRoutes();

  routes.push({
    id: Date.now(),
    name,
    color,
    date: new Date().toLocaleString(),
    points
  });

  localStorage.setItem(
    "faranRoutes",
    JSON.stringify(routes)
  );

  refreshRoutes();
}

function getMergedServerRoutes() {
  /*
    All managed GPX routes now come from the backend.
    This means every route in the admin route manager can be
    updated, reordered, or deleted completely.
  */
  return [...BACKEND_ROUTES];
}

function refreshRoutes() {
  const selector =
    document.getElementById("savedRoutes");

  const currentValue =
    selector.value;

  selector.innerHTML =
    '<option value="">Select route</option>';

  getMergedServerRoutes().forEach(route => {
    const option =
      document.createElement("option");

    option.value = route.id;
    option.textContent = route.name;

    selector.appendChild(option);
  });

  getRoutes().forEach(route => {
    const option =
      document.createElement("option");

    option.value = `user-${route.id}`;
    option.textContent = route.name;

    selector.appendChild(option);
  });

  PRIVATE_DRIVES.forEach(route => {
    const option = document.createElement("option");
    option.value = `drive-${route.id}`;
    option.textContent = `🔒 ${route.name}`;
    selector.appendChild(option);
  });

  if (
    currentValue &&
    [...selector.options].some(
      option => option.value === currentValue
    )
  ) {
    selector.value = currentValue;
  }
}

function getSelectedRouteByValue(value) {
  if (!value) {
    return null;
  }

  const serverRoute =
    getMergedServerRoutes().find(
      route => route.id === value
    );

  if (serverRoute) {
    return serverRoute;
  }

  if (value.startsWith("user-")) {
    const id = Number(value.replace("user-", ""));
    return getRoutes().find(route => route.id === id) || null;
  }

  if (value.startsWith("drive-")) {
    const id = value.replace("drive-", "");
    const saved = PRIVATE_DRIVES.find(route => String(route.id) === id);
    if (!saved) return null;
    return {
      id: `drive-${saved.id}`,
      privateDriveId: saved.id,
      name: saved.name,
      color: "#ff4b36",
      builtin: false,
      points: saved.points || []
    };
  }

  return null;
}

async function loadBackendRoutes() {
  try {
    const response =
      await fetch(
        "/api/routes",
        {
          cache: "no-store",
          credentials: "same-origin"
        }
      );

    if (!response.ok) {
      return;
    }

    const data =
      await response.json();

    BACKEND_ROUTES =
      (data.routes || []).map(route => ({
        id: `db-${route.id}`,
        dbId: route.id,
        name: route.name,
        color: "#ff4b36",
        builtin: true,
        points: route.points || []
      }));

    refreshRoutes();
  } catch (error) {
    console.error(
      "Could not load backend routes:",
      error
    );
  }
}


function clearLiveDriveTrace() {
  driveTraceSegments = [[]];
  removeLine("liveDriveTrace");
}

function showSelectedRoute(route) {
  removeLine("oldRoute");
  clearRouteEndpointMarkers();
  clearLiveDriveTrace();

  selectedRoute = route;

  if (!route) {
    status("Route hidden.");
    return;
  }

  const isBuiltin =
    route.builtin === true;

  setLine(
    "oldRoute",
    route.points,
    isBuiltin
      ? "#ff4b36"
      : (route.color || "#ff4b36"),
    isBuiltin ? .58 : .60,
    isBuiltin ? 4.2 : 6,
    null
  );

  showRouteEndpointMarkers(route);

  const bounds =
    new maplibregl.LngLatBounds();

  route.points.forEach(point => {
    bounds.extend([
      point.lng,
      point.lat
    ]);
  });

  map.fitBounds(
    bounds,
    {
      padding: 55,
      maxZoom: 17
    }
  );

  status(`Route "${route.name}" showing.`);
}

document
  .getElementById("savedRoutes")
  .addEventListener(
    "change",
    event => {
      /* Do not let opening another saved route wipe or replace an active recording.
         The user must stop/save/discard the current recording first. */
      if (followMode) {
        event.target.value = activeDriveRouteSelectorValue;
        status("Recording is still running. Stop the current recording before selecting another saved route.");
        return;
      }

      const route =
        getSelectedRouteByValue(
          event.target.value
        );

      showSelectedRoute(route);

      const routeControls =
        document.getElementById("routeDriveControls");

      const routeDriveBtn =
        document.getElementById("routeDriveBtn");

      const deletePrivateBtn = document.getElementById("deletePrivateDriveBtn");
      deletePrivateBtn.style.display = route?.privateDriveId ? "block" : "none";
      deletePrivateBtn.dataset.routeId = route?.privateDriveId || "";

      if (route) {
        routeControls.style.display = "flex";
        routeDriveBtn.style.display = "inline-block";
      } else {
        routeControls.style.display = "none";
        hideRoutePauseOverlay();

        if (driveModeType === "route") {
          stopDrive();
        }
      }
    }
  );



/* =========================
   PRIVATE SAVED DRIVES
========================= */
function flattenDriveSegments(segments) {
  const points = [];
  for (const segment of segments) {
    for (const point of segment) {
      const previous = points[points.length - 1];
      if (!previous || distanceMetres(previous, point) >= 1) {
        points.push({ lat: point.lat, lng: point.lng });
      }
    }
  }
  return points;
}

async function loadPrivateDrives() {
  try {
    const response = await fetch('/api/driven-routes', {
      cache: 'no-store', credentials: 'same-origin'
    });
    if (!response.ok) return;
    const data = await response.json();
    PRIVATE_DRIVES = data.routes || [];
    refreshRoutes();
  } catch (error) {
    console.warn('Could not load private drives:', error);
  }
}

document.getElementById('saveDriveBtn').addEventListener('click', async () => {
  const points = flattenDriveSegments(lastCompletedDriveSegments);
  if (points.length < 2) {
    alert('There is no completed drive to save yet.');
    return;
  }
  const defaultName = `My drive ${new Date().toLocaleDateString()}`;
  const name = prompt('Name this driven route:', defaultName)?.trim();
  if (!name) return;

  const button = document.getElementById('saveDriveBtn');
  button.disabled = true;
  button.textContent = 'Saving...';
  try {
    const response = await fetch('/api/driven-routes', {
      method: 'POST',
      credentials: 'same-origin',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ name, points })
    });
    const data = await response.json().catch(() => ({}));
    if (!response.ok) throw new Error(data.error || 'Could not save route');
    await loadPrivateDrives();
    button.style.display = 'none';
    removeLine('liveDriveTrace');
    const savedId = data.route?.id;
    if (savedId) {
      const selector = document.getElementById('savedRoutes');
      selector.value = `drive-${savedId}`;
      const savedRoute = getSelectedRouteByValue(`drive-${savedId}`);
      showSelectedRoute(savedRoute);
      document.getElementById('deletePrivateDriveBtn').style.display = 'block';
      document.getElementById('deletePrivateDriveBtn').dataset.routeId = savedId;
      document.getElementById('routeDriveControls').style.display = 'flex';
    }
    await clearDriveDraft();
    lastCompletedDriveSegments = [];
    document.getElementById("discardDriveBtn").style.display = "none";
    status(`Saved "${name}" privately. It is now shown in red and only your account can see it.`);
  } catch (error) {
    alert(error.message || 'Could not save route.');
  } finally {
    button.disabled = false;
    button.textContent = '💾 Save this driven route';
  }
});

document.getElementById('discardDriveBtn').addEventListener('click', async () => {
  if (!confirm('Discard this unsaved route? This cannot be undone.')) return;
  if (followMode) stopDrive();
  lastCompletedDriveSegments = [];
  driveTraceSegments = [[]];
  removeLine('liveDriveTrace');
  document.getElementById('saveDriveBtn').style.display = 'none';
  document.getElementById('discardDriveBtn').style.display = 'none';
  await clearDriveDraft();
  status('Unsaved route discarded.');
});

document.getElementById('deletePrivateDriveBtn').addEventListener('click', async event => {
  const id = event.currentTarget.dataset.routeId;
  if (!id) return;
  if (!confirm('Delete this saved drive?')) return;
  const response = await fetch(`/api/driven-routes?id=${encodeURIComponent(id)}`, {
    method: 'DELETE', credentials: 'same-origin'
  });
  if (!response.ok) {
    alert('Could not delete this saved drive.');
    return;
  }
  selectedRoute = null;
  document.getElementById('savedRoutes').value = '';
  document.getElementById('deletePrivateDriveBtn').style.display = 'none';
  document.getElementById('routeDriveControls').style.display = 'none';
  removeLine('oldRoute');
  clearRouteEndpointMarkers();
  await loadPrivateDrives();
  status('Saved drive deleted.');
});

/* =========================
   SASKATOON HYDRANTS
========================= */

document.getElementById("hydrantBtn").addEventListener("click", async () => {
  hydrantsOn = !hydrantsOn;

  if (!hydrantsOn) {
    hideHydrants();
    return;
  }

  const button =
    document.getElementById("hydrantBtn");

  button.classList.add("active");
  button.textContent = "🔥 Hydrants ON";

  await loadHydrants();
});

function hideHydrants() {
  if (map.getLayer("hydrant-points")) {
    map.removeLayer("hydrant-points");
  }

  if (map.getSource("hydrants")) {
    map.removeSource("hydrants");
  }

  hydrantsOn = false;

  const button =
    document.getElementById("hydrantBtn");

  button.classList.remove("active");
  button.textContent = "🔥 Hydrants";

  status("Hydrants hidden.");
}

async function loadHydrants() {
  if (!hydrantsOn) return;

  status("Loading all Saskatoon hydrants...");

  try {
    /*
      The server endpoint now loads the COMPLETE City hydrant layer in batches,
      plus any hydrants an admin added manually. This prevents hydrants from
      disappearing just because they are outside the current screen bounds.
    */
    const response = await fetch("/api/hydrants", {
      credentials: "same-origin",
      cache: "no-store"
    });

    if (!response.ok) {
      throw new Error("Hydrant request failed");
    }

    const data = await response.json();

    if (data.error && !(data.features || []).length) {
      throw new Error(data.error);
    }

    const features = data.features || [];
    const counts = data.counts || {};

    if (map.getSource("hydrants")) {
      map.getSource("hydrants").setData({
        type: "FeatureCollection",
        features
      });
    } else {
      map.addSource(
        "hydrants",
        {
          type: "geojson",
          data: {
            type: "FeatureCollection",
            features
          }
        }
      );

      map.addLayer({
        id: "hydrant-points",
        type: "circle",
        source: "hydrants",
        paint: {
          "circle-radius": [
            "interpolate",
            ["linear"],
            ["zoom"],
            12, 3,
            14, 4,
            16, 6,
            18, 8
          ],
          "circle-color": "#e53935",
          "circle-stroke-color": [
            "case",
            ["==", ["get", "_manual"], true],
            "#ffd54f",
            "#ffffff"
          ],
          "circle-stroke-width": [
            "case",
            ["==", ["get", "_manual"], true],
            3.2,
            1.8
          ],
          "circle-opacity": .98
        }
      });

      map.on("click", "hydrant-points", event => {
        event.originalEvent.stopPropagation();

        const feature = event.features?.[0];
        if (!feature) return;

        const p = feature.properties || {};
        const coordinates = feature.geometry.coordinates.slice();

        const node =
          p.WMNODENO ??
          p.WM_NODE_NO ??
          p.NODE_NO ??
          p.FACILITYID ??
          "Unknown";

        const statusValue =
          p.STATUS ??
          p.Status ??
          "Unknown";

        const typeValue =
          p.HYDRANT_TYPE ??
          p.HYDRANTTYPE ??
          p.TYPE ??
          "Unknown";

        const yearValue =
          p.YEAR_CONSTRUCTED ??
          p.YEARCONSTRUCTED ??
          p.INSTALL_YEAR ??
          "Unknown";

        const isManual =
          p._manual === true ||
          p._manual === "true" ||
          p._manual === 1 ||
          p._manual === "1";

        const addressValue = p.ADDRESS || "";
        const noteValue = p.NOTE || "";

        const extraManualInfo = isManual
          ? `<strong style="color:#b26a00">Admin-added hydrant</strong><br>` +
            (addressValue ? `Location: ${addressValue}<br>` : "") +
            (noteValue ? `Note: ${noteValue}<br>` : "") +
            `<br>`
          : "";

        new maplibregl.Popup({
          offset: 12,
          closeButton: true
        })
        .setLngLat(coordinates)
        .setHTML(
          `<strong>🔥 Fire Hydrant</strong><br><br>` +
          extraManualInfo +
          (isManual ? "" : `Node #: ${node}<br>`) +
          `Status: ${statusValue}<br>` +
          `Type: ${typeValue}<br>` +
          (isManual ? "" : `Year: ${yearValue}<br>`) +
          `<br><a href="${REPORT_HYDRANT_URL}" target="_blank" rel="noopener">Report Hydrant Issue</a>`
        )
        .addTo(map);
      });

      map.on("mouseenter", "hydrant-points", () => {
        map.getCanvas().style.cursor = "pointer";
      });

      map.on("mouseleave", "hydrant-points", () => {
        map.getCanvas().style.cursor = "";
      });
    }

    const cityCount = Number(counts.city ?? 0);
    const manualCount = Number(counts.manual ?? 0);

    if (data.cityLoadError) {
      status(
        `City hydrant feed is temporarily unavailable. ${manualCount} admin-added hydrants loaded.`
      );
    } else {
      status(
        `${features.length} hydrants loaded city-wide (${cityCount} City + ${manualCount} admin-added).`
      );
    }
  } catch (error) {
    console.error("Hydrant error:", error);
    status("Could not load Saskatoon hydrants right now. Try again shortly.");
  }
}

/* The whole City layer is loaded at once, so moving the map no longer needs
   a new hydrant query. Refresh quietly every 15 minutes while hydrants are ON
   so newly published City hydrants can appear without restarting the app. */
setInterval(() => {
  if (hydrantsOn) {
    loadHydrants();
  }
}, 15 * 60 * 1000);

/* =========================
   STARTUP
========================= */

map.on("load", async () => {
  refreshRoutes();
  await Promise.all([loadBackendRoutes(), loadPrivateDrives()]);
  updateCompass();
  requestScreenWakeLock();
  await restoreDriveDraftIfAny();

  /*
    Do not move to the user's location automatically.
    Use the floating ◎ button, GPS button, or Drive when wanted.
  */
  status("Map ready. Tap ◎ or GPS when you want to show your location.");
});
setInterval(
  loadBackendRoutes,
  60000
);
</script>
<script>
setInterval(async () => {
  try {
    const response = await fetch('/api/access-check', {
      method: 'GET',
      cache: 'no-store',
      credentials: 'same-origin'
    });
    if (response.status === 401) {
      window.location.replace('/login');
      return;
    }
    if (response.status === 403) {
      window.location.replace('/pending');
    }
  } catch (_) {}
}, 30000);
</script>
</body>
