<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Saskatoon Block Finder</title>

  <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@5.6.2/dist/maplibre-gl.css">

  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: Arial, sans-serif;
    }

    #app, #map {
      position: absolute;
      inset: 0;
    }

    /* Make map transition smoothly between day/night */
    .maplibregl-canvas {
      transition: filter .22s ease;
      will-change: transform, filter;
    }

    /* Night mode keeps the SAME detailed OSM tiles, but inverts them.
       This makes dark street labels/house numbers become light and readable. */
    body.dark .maplibregl-canvas {
      filter:
        invert(.82)
        hue-rotate(180deg)
        brightness(.82)
        contrast(.96)
        saturate(.72);
    }

    /* Built-in zoom buttons always stay readable */
    .maplibregl-ctrl-group {
      background: #fff !important;
      border-radius: 10px !important;
      overflow: hidden;
      box-shadow: 0 2px 8px rgba(0,0,0,.35) !important;
    }

    .maplibregl-ctrl-group button {
      background: #fff !important;
    }

    .maplibregl-ctrl-group button:hover {
      background: #eee !important;
    }

    .maplibregl-ctrl-icon {
      filter: none !important;
      opacity: 1 !important;
    }

    /* Google-Maps-style locate button */
    #locateButton {
      position: absolute;
      right: 12px;
      bottom: 62px;
      z-index: 55;
      width: 48px;
      height: 48px;
      border: 0;
      border-radius: 50%;
      background: rgba(255,255,255,.97);
      color: #1769aa;
      font-size: 23px;
      font-weight: 700;
      box-shadow: 0 2px 9px rgba(0,0,0,.35);
      cursor: pointer;
    }

    #locateButton.active {
      background: #1769aa;
      color: #fff;
    }

    body.dark #locateButton {
      background: #f4f4f4;
      color: #1769aa;
    }

    body.dark #locateButton.active {
      background: #1769aa;
      color: #fff;
    }

    /* Three-dot menu */
    #menuButton {
      position: absolute;
      top: 12px;
      left: 12px;
      z-index: 50;
      width: 48px;
      height: 48px;
      border: 0;
      border-radius: 50%;
      background: rgba(255,255,255,.96);
      color: #111;
      font-size: 27px;
      font-weight: 700;
      box-shadow: 0 2px 9px rgba(0,0,0,.35);
      cursor: pointer;
    }

    body.dark #menuButton {
      background: #f4f4f4;
      color: #111;
    }

    /* Main controls */
    #toolbar {
      position: absolute;
      top: 68px;
      left: 10px;
      z-index: 45;
      width: min(365px, calc(100vw - 20px));
      max-height: calc(100vh - 90px);
      overflow-y: auto;
      box-sizing: border-box;
      padding: 10px;
      border-radius: 14px;
      background: rgba(255,255,255,.97);
      box-shadow: 0 4px 16px rgba(0,0,0,.3);
      transition: opacity .2s ease, transform .2s ease;
    }

    #toolbar.hidden {
      opacity: 0;
      pointer-events: none;
      transform: translateX(-110%);
    }

    #toolbar h2 {
      margin: 2px 0 9px;
      font-size: 19px;
    }

    .controls {
      display: flex;
      flex-wrap: wrap;
      gap: 5px;
      margin-bottom: 7px;
    }

    .route-row {
      display: block;
    }

    #savedRoutes {
      width: 100%;
      min-height: 48px;
      font-weight: 700;
      font-size: 16px;
      background: rgba(255,255,255,.96);
    }

    body.dark #savedRoutes {
      background: #2f2f2f;
      color: #fff;
      border-color: #777;
    }

    #routeDriveControls {
      margin-top: 4px;
    }

    #routeDriveBtn,
    #pausePlayBtn {
      min-width: 110px;
      font-weight: 700;
    }

    button, select, input {
      box-sizing: border-box;
      min-height: 42px;
      padding: 8px 10px;
      border: 1px solid #aaa;
      border-radius: 8px;
      background: #fff;
      font-size: 15px;
    }

    button {
      cursor: pointer;
    }

    button.active {
      background: #1769aa;
      color: #fff;
    }

    input {
      width: 100%;
    }

    select {
      max-width: 100%;
    }

    #status {
      margin-top: 5px;
      padding: 9px;
      border-radius: 8px;
      background: #fff3c4;
      font-size: 13px;
      font-weight: 700;
      line-height: 1.45;
    }

    body.dark #toolbar {
      background: rgba(24,24,24,.96);
      color: #fff;
    }

    body.dark button,
    body.dark select,
    body.dark input {
      background: #333;
      color: #fff;
      border-color: #666;
    }

    body.dark #status {
      background: #292929;
      color: #fff;
    }

    /* Custom 4-direction compass */
    #compassRose {
      position: absolute;
      top: 92px;
      right: 10px;
      z-index: 60;
      width: 82px;
      height: 82px;
      border: 0;
      border-radius: 50%;
      padding: 0;
      background: rgba(255,255,255,.96);
      box-shadow: 0 2px 9px rgba(0,0,0,.35);
      cursor: pointer;
      overflow: hidden;
    }

    #compassDial {
      position: absolute;
      inset: 0;
      transition: transform .12s linear;
    }

    .dir {
      position: absolute;
      font-weight: 800;
      font-size: 16px;
      line-height: 1;
      color: #111;
      user-select: none;
    }

    .dir.n {
      top: 7px;
      left: 50%;
      transform: translateX(-50%);
      color: #d71920;
    }

    .dir.s {
      bottom: 7px;
      left: 50%;
      transform: translateX(-50%);
    }

    .dir.e {
      right: 8px;
      top: 50%;
      transform: translateY(-50%);
    }

    .dir.w {
      left: 8px;
      top: 50%;
      transform: translateY(-50%);
    }

    .compass-center {
      position: absolute;
      left: 50%;
      top: 50%;
      width: 9px;
      height: 9px;
      transform: translate(-50%, -50%);
      border-radius: 50%;
      background: #111;
    }

    .compass-arrow {
      position: absolute;
      top: 21px;
      left: 50%;
      width: 0;
      height: 0;
      transform: translateX(-50%);
      border-left: 5px solid transparent;
      border-right: 5px solid transparent;
      border-bottom: 13px solid #d71920;
    }

    body.dark #compassRose {
      background: rgba(245,245,245,.97);
    }

    /* GPS / driving arrow */
    .drive-arrow {
      width: 40px;
      will-change: transform;
      height: 40px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .drive-arrow-inner {
      width: 0;
      height: 0;
      border-left: 14px solid transparent;
      border-right: 14px solid transparent;
      border-bottom: 35px solid #1976d2;
      filter: drop-shadow(0 2px 3px rgba(0,0,0,.75));
    }

    /* Clicked address popup */
    .address-marker {
      min-width: 125px;
      max-width: 205px;
      padding: 7px 9px;
      border: 2px solid #111;
      border-radius: 9px;
      background: rgba(255,255,255,.98);
      color: #111;
      text-align: center;
      font-size: 13px;
      font-weight: 700;
      box-shadow: 0 2px 7px rgba(0,0,0,.4);
      cursor: pointer;
    }

    /* Route start / finish markers */
    .route-start-marker {
      width: 17px;
      height: 17px;
      border-radius: 50%;
      background: #18bf63;
      border: 3px solid #fff;
      box-shadow: 0 1px 5px rgba(0,0,0,.55);
    }

    .route-finish-marker {
      width: 18px;
      height: 18px;
      border: 2px solid #fff;
      box-shadow: 0 1px 5px rgba(0,0,0,.6);
      background:
        conic-gradient(
          #111 0 25%,
          #fff 0 50%,
          #111 0 75%,
          #fff 0
        ) 0 0 / 8px 8px;
    }

    /* Floating Route Drive pause/play control */
    #routePauseOverlay {
      position: absolute;
      left: 50%;
      bottom: 92px;
      transform: translateX(-50%);
      z-index: 70;
      display: none;
      align-items: center;
      justify-content: center;
      pointer-events: none;
      opacity: 0;
      transition: opacity .22s ease;
    }

    #routePauseOverlay.show {
      display: flex;
      opacity: 1;
    }

    #routePauseOverlay button {
      pointer-events: auto;
      min-width: 118px;
      min-height: 48px;
      border: 0;
      border-radius: 24px;
      background: rgba(20,20,20,.90);
      color: #fff;
      font-size: 16px;
      font-weight: 800;
      box-shadow: 0 3px 12px rgba(0,0,0,.35);
    }

    body.dark #routePauseOverlay button {
      background: rgba(245,245,245,.94);
      color: #111;
    }

    /* Drive information */
    #driveInfo {
      position: absolute;
      left: 50%;
      bottom: 40px;
      transform: translateX(-50%);
      z-index: 40;
      display: none;
      white-space: nowrap;
      padding: 8px 14px;
      border-radius: 18px;
      background: rgba(20,20,20,.90);
      color: #fff;
      font-size: 13px;
      font-weight: 700;
    }

    #credit {
      position: absolute;
      bottom: 7px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 40;
      padding: 4px 10px;
      border-radius: 12px;
      background: rgba(255,255,255,.92);
      color: #222;
      font-size: 11px;
      font-weight: 700;
      white-space: nowrap;
    }

    body.dark #credit {
      background: rgba(20,20,20,.90);
      color: #fff;
    }

    @media (max-width: 650px) {
      #compassRose {
        top: 92px;
        right: 10px;
        width: 72px;
        height: 72px;
      }

      .dir {
        font-size: 14px;
      }

      #toolbar {
        width: min(350px, calc(100vw - 20px));
      }
    }
  
    #authBar {
      margin-top: 8px;
      text-align: center;
      font-size: 12px;
    }
    #authBar a {
      color: #1769aa;
      text-decoration: none;
      font-weight: 700;
    }
    body.dark #authBar a {
      color: #8ec7ff;
    }
</style>
</head>

<body>
<div id="app">
  <div id="map"></div>

  <button id="menuButton" aria-label="Open menu">⋮</button>

  <button id="locateButton" aria-label="Show my location" title="Show my location">◎</button>

  <button id="compassRose" aria-label="Compass. Tap to reset north" title="Tap to reset North">
    <div id="compassDial">
      <span class="dir n">N</span>
      <span class="dir e">E</span>
      <span class="dir s">S</span>
      <span class="dir w">W</span>
      <span class="compass-arrow"></span>
      <span class="compass-center"></span>
    </div>
  </button>

  <div id="toolbar">
    <h2>Saskatoon Block Finder</h2>

    <div class="controls">
      <button id="followBtn" title="Drive follows your location but keeps your chosen zoom">🚗 Drive</button>
      <button id="gpsBtn">📍 GPS</button>
      <button id="darkBtn">🌙 Night</button>
      <button id="hydrantBtn">🔥 Hydrants</button>
    </div>

    <div class="controls route-row">
      <select id="savedRoutes">
        <option value="">Select route</option>
      </select>
    </div>

    <div class="controls" id="routeDriveControls" style="display:none;">
      <button id="routeDriveBtn">🛣️ Drive Route</button>
    </div>

    <div id="status">Select a route or use Drive for normal driving.</div>
    <div id="authBar"><a href="/logout">🔒 Sign out</a></div>
  </div>

  <div id="driveInfo"></div>

  <div id="routePauseOverlay" aria-hidden="true">
    <button id="pausePlayBtn">⏸ Pause</button>
  </div>

  <div id="credit">Saskatoon Block Finder • Made by Faran</div>
</div>

function blockRange(number) {
  const n = parseInt(number);
  if (Number.isNaN(n)) return null;

  const start = Math.floor(n / 100) * 100;
  return {
    start,
    end: start + 99,
    text: `${start}-${start + 99}`
  };
}

function distanceMetres(a, b) {
  const R = 6371000;
  const lat1 = a.lat * Math.PI / 180;
  const lat2 = b.lat * Math.PI / 180;
  const dLat = (b.lat - a.lat) * Math.PI / 180;
  const dLng = (b.lng - a.lng) * Math.PI / 180;

  const h =
    Math.sin(dLat / 2) ** 2 +
    Math.cos(lat1) *
    Math.cos(lat2) *
    Math.sin(dLng / 2) ** 2;

  return R * 2 * Math.atan2(Math.sqrt(h), Math.sqrt(1 - h));
}

function routeDistance(points) {
  let total = 0;
  for (let i = 1; i < points.length; i++) {
    total += distanceMetres(points[i - 1], points[i]);
  }
  return total;
}

function calculateBearing(a, b) {
  const lat1 = a.lat * Math.PI / 180;
  const lat2 = b.lat * Math.PI / 180;
  const dLng = (b.lng - a.lng) * Math.PI / 180;

  const y = Math.sin(dLng) * Math.cos(lat2);
  const x =
    Math.cos(lat1) * Math.sin(lat2) -
    Math.sin(lat1) * Math.cos(lat2) * Math.cos(dLng);

  return (Math.atan2(y, x) * 180 / Math.PI + 360) % 360;
}

async function reverseGeocode(lat, lng) {
  const key = `${lat.toFixed(5)},${lng.toFixed(5)}`;

  if (blockCache.has(key)) {
    return blockCache.get(key);
  }

  try {
    const url =
      "https://nominatim.openstreetmap.org/reverse" +
      "?format=jsonv2" +
      "&addressdetails=1" +
      "&zoom=18" +
      "&lat=" + lat +
      "&lon=" + lng;

    const response = await fetch(url);
    const data = await response.json();
    const a = data.address || {};

    const result = {
      road:
        a.road ||
        a.street ||
        a.residential ||
        a.pedestrian ||
        a.service ||
        "Street unknown",
      house: a.house_number || null
    };

    blockCache.set(key, result);
    return result;
  } catch {
    return {
      road: "Street unknown",
      house: null
    };
  }
}

async function findNearbyBlock(lat, lng, road) {
  if (!road || road === "Street unknown") return null;

  const controller = new AbortController();
  const timer = setTimeout(() => controller.abort(), 3500);

  try {
    const safeRoad = road.replace(/"/g, '\\"');

    const query = `
[out:json][timeout:3];
(
  node["addr:housenumber"]["addr:street"="${safeRoad}"](around:220,${lat},${lng});
  way["addr:housenumber"]["addr:street"="${safeRoad}"](around:220,${lat},${lng});
);
out center tags 30;
`;

    const url =
      "https://overpass-api.de/api/interpreter?data=" +
      encodeURIComponent(query);

    const response = await fetch(url, {
      signal: controller.signal
    });

    const data = await response.json();
    clearTimeout(timer);

    const numbers = [];

    for (const item of data.elements || []) {
      const num = parseInt(item.tags?.["addr:housenumber"]);
      if (!Number.isNaN(num)) {
        numbers.push(num);
      }
    }

    if (!numbers.length) return null;

    numbers.sort((a, b) => a - b);

    return blockRange(
      numbers[Math.floor(numbers.length / 2)]
    );
  } catch {
    clearTimeout(timer);
    return null;
  }
}

async function showBlock(lat, lng) {
  status("Finding street and block...");

  const info = await reverseGeocode(lat, lng);

  let block =
    info.house
      ? blockRange(info.house)
      : null;

  if (!block) {
    block = await findNearbyBlock(lat, lng, info.road);
  }

  const blockText =
    block
      ? `${block.text} ${info.road}`
      : `Block unknown • ${info.road}`;

  status(
    `Street: ${info.road}<br>` +
    `Block: ${blockText}` +
    (info.house ? `<br>Nearest address: ${info.house}` : "")
  );

  if (addressMarker) {
    addressMarker.remove();
  }

  const box = document.createElement("div");
  box.className = "address-marker";
  box.innerHTML =
    (info.house ? `${info.house}<br>` : "") +
    blockText +
    "<br><small>Tap to close</small>";

  addressMarker =
    new maplibregl.Marker({
      element: box,
      anchor: "bottom"
    })
    .setLngLat([lng, lat])
    .addTo(map);

  box.addEventListener("click", event => {
    event.stopPropagation();

    if (addressMarker) {
      addressMarker.remove();
      addressMarker = null;
    }
  });
}

let lastMapTapTime = 0;
let lastMapTapPoint = null;

function closeAddressMarker() {
  if (addressMarker) {
    addressMarker.remove();
    addressMarker = null;
    status("Location label closed.");
    return true;
  }

  return false;
}

/*
  Single tap:
  - During Route Drive, show Pause/Play briefly.
  - Otherwise do nothing, so accidental touches do not open addresses.
*/
map.on("click", event => {
  if (
    followMode &&
    driveModeType === "route"
  ) {
    showRoutePauseOverlay();
  }

  /*
    Manual double-tap detection for phones.
    MapLibre's dblclick works well with a mouse,
    but mobile double-tap is handled here too.
  */
  const now = Date.now();

  if (
    lastMapTapTime &&
    now - lastMapTapTime <= 350 &&
    lastMapTapPoint
  ) {
    const dx =
      event.point.x -
      lastMapTapPoint.x;

    const dy =
      event.point.y -
      lastMapTapPoint.y;

    const distance =
      Math.sqrt(
        dx * dx +
        dy * dy
      );

    if (distance <= 32) {
      lastMapTapTime = 0;
      lastMapTapPoint = null;

      if (closeAddressMarker()) {
        return;
      }

      showBlock(
        event.lngLat.lat,
        event.lngLat.lng
      );

      return;
    }
  }

  lastMapTapTime = now;
  lastMapTapPoint = {
    x: event.point.x,
    y: event.point.y
  };
});

/*
  Desktop double-click.
  Prevent default double-click zoom so the action
  is used for the address/block lookup instead.
*/
map.doubleClickZoom.disable();

map.on("dblclick", event => {
  if (closeAddressMarker()) {
    return;
  }

  showBlock(
    event.lngLat.lat,
    event.lngLat.lng
  );
});

function createGpsArrow() {
  const wrapper = document.createElement("div");
  wrapper.className = "drive-arrow";

  const arrow = document.createElement("div");
  arrow.className = "drive-arrow-inner";

  wrapper.appendChild(arrow);
  return wrapper;
}

function updateGpsMarker(lng, lat, heading) {
  if (!gpsMarker) {
    gpsMarker =
      new maplibregl.Marker({
        element: createGpsArrow(),
        rotationAlignment: "viewport",
        pitchAlignment: "viewport"
      })
      .setLngLat([lng, lat])
      .addTo(map);
  }

  gpsMarker
    .setLngLat([lng, lat])
    .setRotation(heading || 0);
}

let gpsMarkerAnimation = null;
let gpsDisplayPosition = null;

function smoothGpsMarkerTo(lng, lat, duration = 850) {
  if (!gpsMarker) {
    updateGpsMarker(lng, lat, 0);
    gpsDisplayPosition = { lng, lat };
    return;
  }

  const start = gpsDisplayPosition || {
    lng: gpsMarker.getLngLat().lng,
    lat: gpsMarker.getLngLat().lat
  };

  const target = { lng, lat };
  const started = performance.now();

  if (gpsMarkerAnimation) {
    cancelAnimationFrame(gpsMarkerAnimation);
  }

  function frame(now) {
    const raw = Math.min(1, (now - started) / duration);
    const t = 1 - Math.pow(1 - raw, 3);

    const currentLng = start.lng + (target.lng - start.lng) * t;
    const currentLat = start.lat + (target.lat - start.lat) * t;

    gpsMarker.setLngLat([currentLng, currentLat]).setRotation(0);
    gpsDisplayPosition = { lng: currentLng, lat: currentLat };

    if (raw < 1 && followMode) {
      gpsMarkerAnimation = requestAnimationFrame(frame);
    } else {
      gpsDisplayPosition = target;
      gpsMarkerAnimation = null;
    }
  }

  gpsMarkerAnimation = requestAnimationFrame(frame);
}

/* =========================
   FLOATING MY LOCATION BUTTON
========================= */

document
  .getElementById("locateButton")
  .addEventListener(
    "click",
    () => {
      if (!navigator.geolocation) {
        status("GPS not supported.");
        return;
      }

      const button =
        document.getElementById("locateButton");

      button.classList.add("active");
      status("Finding your location...");

      navigator.geolocation.getCurrentPosition(
        position => {
          const lat =
            position.coords.latitude;

          const lng =
            position.coords.longitude;

          updateGpsMarker(
            lng,
            lat,
            0
          );

          map.easeTo({
            center: [lng, lat],
            zoom: Math.max(map.getZoom(), 16.5),
            duration: 650
          });

          status(
            `Your location • GPS ±${Math.round(position.coords.accuracy)} m`
          );

          setTimeout(
            () => button.classList.remove("active"),
            900
          );
        },
        () => {
          button.classList.remove("active");
          status("Please allow precise location.");
        },
        {
          enableHighAccuracy: true,
          maximumAge: 0,
          timeout: 12000
        }
      );
    }
  );


/* =========================
   ACCURATE GPS BUTTON
========================= */

document.getElementById("gpsBtn").addEventListener("click", getAccurateGPS);

function getAccurateGPS() {
  if (!navigator.geolocation) {
    status("GPS not supported.");
    return;
  }

  status("Getting accurate GPS...");

  let best = null;
  let readings = 0;

  const watcher =
    navigator.geolocation.watchPosition(
      position => {
        readings++;

        if (
          !best ||
          position.coords.accuracy <
          best.coords.accuracy
        ) {
          best = position;
        }

        status(
          `Improving GPS...<br>` +
          `Accuracy ±${Math.round(position.coords.accuracy)} m`
        );

        if (
          position.coords.accuracy <= 8 ||
          readings >= 8
        ) {
          navigator.geolocation.clearWatch(watcher);

          const lat = best.coords.latitude;
          const lng = best.coords.longitude;

          updateGpsMarker(lng, lat, 0);

          map.flyTo({
            center: [lng, lat],
            zoom: 18,
            duration: 500
          });

          showBlock(lat, lng);
        }
      },
      () => {
        status("Please allow precise location.");
      },
      {
        enableHighAccuracy: true,
        maximumAge: 0,
        timeout: 15000
      }
    );
}

/* =========================
   DRIVE MODE
========================= */

document.getElementById("followBtn").addEventListener("click", () => {
  if (followMode && driveModeType === "casual") {
    stopDrive();
  } else {
    startCasualDrive();
  }
});

document.getElementById("routeDriveBtn").addEventListener("click", () => {
  if (!selectedRoute) {
    alert("Select a route first.");
    return;
  }

  if (followMode && driveModeType === "route") {
    stopDrive();
  } else {
    startRouteDrive();
  }
});

function prepareDrive(mode) {
  if (!navigator.geolocation) {
    status("GPS not supported.");
    return false;
  }

  if (followWatchId != null) {
    navigator.geolocation.clearWatch(followWatchId);
    followWatchId = null;
  }

  followMode = true;
  driveModeType = mode;
  lastGps = null;
  lastHeading = map.getBearing() || 0;
  lastDriveMapUpdate = 0;

  driveTracePaused = false;

  if (mode === "route") {
    clearLiveDriveTrace();
    driveTraceSegments = [[]];
  }

  setMenu(false);

  document.getElementById("driveInfo").style.display = "block";

  document.getElementById("followBtn").classList.toggle(
    "active",
    mode === "casual"
  );

  document.getElementById("followBtn").textContent =
    mode === "casual"
      ? "⏹ Stop Drive"
      : "🚗 Drive";

  const routeDriveBtn =
    document.getElementById("routeDriveBtn");

  const pausePlayBtn =
    document.getElementById("pausePlayBtn");

  if (mode === "route") {
    routeDriveBtn.classList.add("active");
    routeDriveBtn.textContent = "⏹ Stop Route";
    pausePlayBtn.textContent = "⏸ Pause";
    showRoutePauseOverlay();
  } else {
    routeDriveBtn.classList.remove("active");
    routeDriveBtn.textContent = "🛣️ Drive Route";
    hideRoutePauseOverlay();
  }

  return true;
}

function startCasualDrive() {
  if (!prepareDrive("casual")) {
    return;
  }

  status("Normal Drive started. Your position stays centered on the map.");

  startDriveWatcher();
}

function startRouteDrive() {
  if (!selectedRoute) {
    alert("Select a route first.");
    return;
  }

  if (!prepareDrive("route")) {
    return;
  }

  status(
    `Driving "${selectedRoute.name}". Red = planned route, blue = where you actually drive.`
  );

  startDriveWatcher();
}

function startDriveWatcher() {
  followWatchId =
    navigator.geolocation.watchPosition(
      position => {
        if (!followMode) return;

        const now = Date.now();
        const lat = position.coords.latitude;
        const lng = position.coords.longitude;
        const accuracy = position.coords.accuracy;
        const speed = position.coords.speed;

        const currentPoint = { lat, lng };

        let heading = position.coords.heading;

        if (
          (heading == null || Number.isNaN(heading)) &&
          lastGps
        ) {
          const moved =
            distanceMetres(
              lastGps,
              currentPoint
            );

          if (moved >= 2.5) {
            heading =
              calculateBearing(
                lastGps,
                currentPoint
              );
          }
        }

        if (
          heading != null &&
          !Number.isNaN(heading)
        ) {
          const difference =
            ((heading - lastHeading + 540) % 360) - 180;

          lastHeading =
            (
              lastHeading +
              difference * 0.22 +
              360
            ) % 360;
        }

        /*
          Arrow stays forward while the map rotates.
        */
        updateGpsMarker(
          lng,
          lat,
          0
        );

        /*
          Only Route Drive records the blue comparison line.
        */
        if (
          driveModeType === "route" &&
          selectedRoute &&
          !driveTracePaused &&
          accuracy <= 50
        ) {
          let currentSegment =
            driveTraceSegments[
              driveTraceSegments.length - 1
            ];

          if (!currentSegment) {
            currentSegment = [];
            driveTraceSegments.push(currentSegment);
          }

          const previous =
            currentSegment[
              currentSegment.length - 1
            ];

          if (
            !previous ||
            distanceMetres(
              previous,
              currentPoint
            ) >= 1.5
          ) {
            currentSegment.push(
              currentPoint
            );

            setMultiLine(
              "liveDriveTrace",
              driveTraceSegments,
              "#1689ff",
              .84,
              4.8
            );
          }
        }

        /*
          Keep the blue arrow in a fixed lower-center position while driving.
          IMPORTANT: we do NOT set zoom here.
          Whatever zoom you choose with + / - stays exactly as you set it.
        */
        if (
          now - lastDriveMapUpdate > 650
        ) {
          lastDriveMapUpdate = now;

          const arrowScreenOffsetY =
            Math.min(
              190,
              Math.max(
                115,
                window.innerHeight * 0.17
              )
            );

          map.easeTo({
            center: [lng, lat],
            bearing: lastHeading,
            pitch: 0,
            offset: [0, arrowScreenOffsetY],
            duration: 700,
            easing: t =>
              1 - Math.pow(1 - t, 3)
          });
        }

        let speedKmh = null;

        if (speed != null) {
          speedKmh =
            Math.max(0, speed * 3.6);
        }

        document.getElementById("driveInfo").innerHTML =
          (speedKmh == null
            ? ""
            : `${speedKmh.toFixed(0)} km/h • `) +
          `GPS ±${Math.round(accuracy)} m`;

        if (
          hydrantsOn &&
          now - driveHydrantReloadTime > 20000
        ) {
          driveHydrantReloadTime = now;
          loadHydrants();
        }

        lastGps = currentPoint;
      },
      error => {
        console.error(
          "Drive GPS error:",
          error
        );

        status(
          "Please allow precise location."
        );

        stopDrive();
      },
      {
        enableHighAccuracy: true,
        maximumAge: 250,
        timeout: 15000
      }
    );
}

function stopDrive() {
  const oldMode =
    driveModeType;

  followMode = false;
  driveModeType = null;

  if (followWatchId != null) {
    navigator.geolocation.clearWatch(
      followWatchId
    );

    followWatchId = null;
  }

  document.getElementById("followBtn").classList.remove("active");
  document.getElementById("followBtn").textContent = "🚗 Drive";

  const routeDriveBtn =
    document.getElementById("routeDriveBtn");

  routeDriveBtn.classList.remove("active");
  routeDriveBtn.textContent = "🛣️ Drive Route";

  hideRoutePauseOverlay();
  document.getElementById("driveInfo").style.display = "none";

  driveTracePaused = false;

  if (oldMode === "route" && selectedRoute) {
    status(
      `Route Drive stopped. "${selectedRoute.name}" is still showing.`
    );
  } else {
    status(
      "Normal Drive stopped."
    );
  }
}

/*
  Pause / Play only exists for Route Drive.
  Pause stops recording the blue comparison line.
  Your GPS position and map can still follow you.
*/
document
  .getElementById("pausePlayBtn")
  .addEventListener(
    "click",
    () => {
      if (
        !followMode ||
        driveModeType !== "route" ||
        !selectedRoute
      ) {
        return;
      }

      const wasPaused =
        driveTracePaused;

      driveTracePaused =
        !driveTracePaused;

      /*
        When resuming after a pause, begin a brand-new blue segment.
        This prevents an ugly straight line connecting the pause point
        to wherever you restarted.
      */
      if (
        wasPaused &&
        !driveTracePaused
      ) {
        driveTraceSegments.push([]);
      }

      document
        .getElementById("pausePlayBtn")
        .textContent =
          driveTracePaused
            ? "▶ Play"
            : "⏸ Pause";

      status(
        driveTracePaused
          ? "Route tracking paused."
          : `Route tracking resumed for "${selectedRoute.name}".`
      );

      showRoutePauseOverlay();
    }
  );


/* =========================
   ROUTE LINE HELPERS
========================= */

function setLine(
  id,
  points,
  color,
  opacity = .5,
  width = 7,
  dash = null
) {
  if (points.length < 2) return;

  const data = {
    type: "Feature",
    geometry: {
      type: "LineString",
      coordinates:
        points.map(point => [
          point.lng,
          point.lat
        ])
    }
  };

  if (map.getSource(id)) {
    map.getSource(id).setData(data);
    return;
  }

  map.addSource(id, {
    type: "geojson",
    data
  });

  const paint = {
    "line-color": color,
    "line-width": width,
    "line-opacity": opacity
  };

  if (dash) {
    paint["line-dasharray"] = dash;
  }

  map.addLayer({
    id,
    type: "line",
    source: id,
    layout: {
      "line-join": "round",
      "line-cap": "round"
    },
    paint
  });
}

function removeLine(id) {
  if (map.getLayer(id)) {
    map.removeLayer(id);
  }

  if (map.getSource(id)) {
    map.removeSource(id);
  }
}


function setMultiLine(
  id,
  segments,
  color,
  opacity = .84,
  width = 4.8
) {
  const usableSegments =
    segments
      .filter(segment => segment.length >= 2)
      .map(segment =>
        segment.map(point => [
          point.lng,
          point.lat
        ])
      );

  if (!usableSegments.length) {
    return;
  }

  const data = {
    type: "Feature",
    geometry: {
      type: "MultiLineString",
      coordinates: usableSegments
    }
  };

  if (map.getSource(id)) {
    map.getSource(id).setData(data);
    return;
  }

  map.addSource(id, {
    type: "geojson",
    data
  });

  map.addLayer({
    id,
    type: "line",
    source: id,
    layout: {
      "line-join": "round",
      "line-cap": "round"
    },
    paint: {
      "line-color": color,
      "line-width": width,
      "line-opacity": opacity
    }
  });
}

/* =========================
   ROUTE START / FINISH
========================= */

function clearRouteEndpointMarkers() {
  if (routeStartMarker) {
    routeStartMarker.remove();
    routeStartMarker = null;
  }

  if (routeFinishMarker) {
    routeFinishMarker.remove();
    routeFinishMarker = null;
  }
}

function showRouteEndpointMarkers(route) {
  // Start/end markers intentionally hidden.
  clearRouteEndpointMarkers();
}


/* =========================
   SAVED ROUTES
========================= */

function getRoutes() {
  try {
    return JSON.parse(
      localStorage.getItem("faranRoutes") ||
      "[]"
    );
  } catch {
    return [];
  }
}

function saveRoute(name, points, color) {
  const routes = getRoutes();

  routes.push({
    id: Date.now(),
    name,
    color,
    date: new Date().toLocaleString(),
    points
  });

  localStorage.setItem(
    "faranRoutes",
    JSON.stringify(routes)
  );

  refreshRoutes();
}

function getMergedServerRoutes() {
  /*
    Admin-uploaded routes override a built-in route when the names match.
    That means you can upload a corrected GPX with the same route name
    and it immediately replaces the old copy in the dropdown.
  */
  const backendNames =
    new Set(
      BACKEND_ROUTES.map(
        route => route.name.toLowerCase()
      )
    );

  const builtinsNotOverridden =
    BUILTIN_ROUTES.filter(
      route =>
        !backendNames.has(
          route.name.toLowerCase()
        )
    );

  return [
    ...builtinsNotOverridden,
    ...BACKEND_ROUTES
  ];
}

function refreshRoutes() {
  const selector =
    document.getElementById("savedRoutes");

  const currentValue =
    selector.value;

  selector.innerHTML =
    '<option value="">Select route</option>';

  getMergedServerRoutes().forEach(route => {
    const option =
      document.createElement("option");

    option.value = route.id;
    option.textContent = route.name;

    selector.appendChild(option);
  });

  getRoutes().forEach(route => {
    const option =
      document.createElement("option");

    option.value = `user-${route.id}`;
    option.textContent = route.name;

    selector.appendChild(option);
  });

  if (
    currentValue &&
    [...selector.options].some(
      option => option.value === currentValue
    )
  ) {
    selector.value = currentValue;
  }
}

function getSelectedRouteByValue(value) {
  if (!value) {
    return null;
  }

  const serverRoute =
    getMergedServerRoutes().find(
      route => route.id === value
    );

  if (serverRoute) {
    return serverRoute;
  }

  if (value.startsWith("user-")) {
    const id =
      Number(
        value.replace("user-", "")
      );

    return getRoutes().find(
      route => route.id === id
    ) || null;
  }

  return null;
}

async function loadBackendRoutes() {
  try {
    const response =
      await fetch(
        "/api/routes",
        {
          cache: "no-store",
          credentials: "same-origin"
        }
      );

    if (!response.ok) {
      return;
    }

    const data =
      await response.json();

    BACKEND_ROUTES =
      (data.routes || []).map(route => ({
        id: `db-${route.id}`,
        dbId: route.id,
        name: route.name,
        color: "#ff4b36",
        builtin: true,
        points: route.points || []
      }));

    refreshRoutes();
  } catch (error) {
    console.error(
      "Could not load backend routes:",
      error
    );
  }
}


function clearLiveDriveTrace() {
  driveTraceSegments = [[]];
  removeLine("liveDriveTrace");
}

function showSelectedRoute(route) {
  removeLine("oldRoute");
  clearRouteEndpointMarkers();
  clearLiveDriveTrace();

  selectedRoute = route;

  if (!route) {
    status("Route hidden.");
    return;
  }

  const isBuiltin =
    route.builtin === true;

  setLine(
    "oldRoute",
    route.points,
    isBuiltin
      ? "#ff4b36"
      : (route.color || "#ff4b36"),
    isBuiltin ? .58 : .60,
    isBuiltin ? 4.2 : 6,
    null
  );

  showRouteEndpointMarkers(route);

  const bounds =
    new maplibregl.LngLatBounds();

  route.points.forEach(point => {
    bounds.extend([
      point.lng,
      point.lat
    ]);
  });

  map.fitBounds(
    bounds,
    {
      padding: 55,
      maxZoom: 17
    }
  );

  status(`Route "${route.name}" showing.`);
}

document
  .getElementById("savedRoutes")
  .addEventListener(
    "change",
    event => {
      const route =
        getSelectedRouteByValue(
          event.target.value
        );

      showSelectedRoute(route);

      const routeControls =
        document.getElementById("routeDriveControls");

      const routeDriveBtn =
        document.getElementById("routeDriveBtn");

      if (route) {
        routeControls.style.display = "flex";
        routeDriveBtn.style.display = "inline-block";
      } else {
        routeControls.style.display = "none";
        hideRoutePauseOverlay();

        if (driveModeType === "route") {
          stopDrive();
        }
      }
    }
  );


/* =========================
   SASKATOON HYDRANTS
========================= */

document.getElementById("hydrantBtn").addEventListener("click", async () => {
  hydrantsOn = !hydrantsOn;

  if (!hydrantsOn) {
    hideHydrants();
    return;
  }

  const button =
    document.getElementById("hydrantBtn");

  button.classList.add("active");
  button.textContent = "🔥 Hydrants ON";

  await loadHydrants();
});

function hideHydrants() {
  if (map.getLayer("hydrant-points")) {
    map.removeLayer("hydrant-points");
  }

  if (map.getSource("hydrants")) {
    map.removeSource("hydrants");
  }

  hydrantsOn = false;

  const button =
    document.getElementById("hydrantBtn");

  button.classList.remove("active");
  button.textContent = "🔥 Hydrants";

  status("Hydrants hidden.");
}

async function loadHydrants() {
  if (!hydrantsOn) return;

  status("Loading Saskatoon hydrants...");

  const bounds = map.getBounds();

  const geometry = {
    xmin: bounds.getWest(),
    ymin: bounds.getSouth(),
    xmax: bounds.getEast(),
    ymax: bounds.getNorth(),
    spatialReference: {
      wkid: 4326
    }
  };

  const params =
    new URLSearchParams({
      where: "1=1",
      geometry: JSON.stringify(geometry),
      geometryType: "esriGeometryEnvelope",
      spatialRel: "esriSpatialRelIntersects",
      inSR: "4326",
      outSR: "4326",
      outFields: "*",
      returnGeometry: "true",
      f: "geojson"
    });

  try {
    const response =
      await fetch(
        HYDRANT_SERVICE +
        "?" +
        params.toString()
      );

    if (!response.ok) {
      throw new Error("Hydrant request failed");
    }

    const data =
      await response.json();

    if (data.error) {
      throw new Error(
        data.error.message ||
        "ArcGIS error"
      );
    }

    const features =
      data.features || [];

    if (map.getSource("hydrants")) {
      map.getSource("hydrants").setData(data);
    } else {
      map.addSource(
        "hydrants",
        {
          type: "geojson",
          data
        }
      );

      map.addLayer({
        id: "hydrant-points",
        type: "circle",
        source: "hydrants",
        paint: {
          "circle-radius": [
            "interpolate",
            ["linear"],
            ["zoom"],
            12, 3,
            14, 4,
            16, 6,
            18, 8
          ],
          "circle-color": "#e53935",
          "circle-stroke-color": "#ffffff",
          "circle-stroke-width": 1.8,
          "circle-opacity": .98
        }
      });

      map.on("click", "hydrant-points", event => {
        event.originalEvent.stopPropagation();

        const feature =
          event.features?.[0];

        if (!feature) return;

        const p =
          feature.properties || {};

        const coordinates =
          feature.geometry.coordinates.slice();

        const node =
          p.WMNODENO ??
          p.WM_NODE_NO ??
          p.NODE_NO ??
          p.FACILITYID ??
          "Unknown";

        const statusValue =
          p.STATUS ??
          p.Status ??
          "Unknown";

        const typeValue =
          p.HYDRANT_TYPE ??
          p.HYDRANTTYPE ??
          p.TYPE ??
          "Unknown";

        const yearValue =
          p.YEAR_CONSTRUCTED ??
          p.YEARCONSTRUCTED ??
          p.INSTALL_YEAR ??
          "Unknown";

        new maplibregl.Popup({
          offset: 12,
          closeButton: true
        })
        .setLngLat(coordinates)
        .setHTML(
          `<strong>🔥 Fire Hydrant</strong><br><br>` +
          `Node #: ${node}<br>` +
          `Status: ${statusValue}<br>` +
          `Type: ${typeValue}<br>` +
          `Year: ${yearValue}<br><br>` +
          `<a href="${REPORT_HYDRANT_URL}" target="_blank" rel="noopener">Report Hydrant Issue</a>`
        )
        .addTo(map);
      });

      map.on("mouseenter", "hydrant-points", () => {
        map.getCanvas().style.cursor = "pointer";
      });

      map.on("mouseleave", "hydrant-points", () => {
        map.getCanvas().style.cursor = "";
      });
    }

    status(
      `${features.length} hydrants loaded in this map area.`
    );
  } catch (error) {
    console.error("Hydrant error:", error);

    status(
      "Could not load hydrants. Zoom into Saskatoon and try again."
    );
  }
}

/* Reload hydrants after normal map movement,
   but not constantly while Drive Mode is running. */
map.on("moveend", () => {
  if (!hydrantsOn || followMode) {
    return;
  }

  clearTimeout(hydrantReloadTimer);

  hydrantReloadTimer =
    setTimeout(
      loadHydrants,
      700
    );
});

/* =========================
   STARTUP
========================= */

map.on("load", () => {
  refreshRoutes();
  loadBackendRoutes();
  updateCompass();

  /*
    Do not move to the user's location automatically.
    Use the floating ◎ button, GPS button, or Drive when wanted.
  */
  status("Map ready. Tap ◎ or GPS when you want to show your location.");
});
setInterval(
  loadBackendRoutes,
  60000
);
</script>
